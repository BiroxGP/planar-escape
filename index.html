<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planar Escape</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#e9e4da; --surface:#f6f2e9; --surface-2:#efe8da;
  --ink:#2b2420; --ink-soft:#5f564a; --ink-faint:#8a8072; --line:#d2c7ae;
  --portal:#146b67; --portal-soft:#dcefec;
  --ember:#a94f1e; --ember-soft:#f4e0cd;
  --arcane:#5f3f92; --arcane-soft:#ece2f7;
  --good:#2f7d4f; --good-soft:#dcefe1;
  --bad:#a92e2e; --bad-soft:#f5dcdc;
  --shadow:rgba(43,36,32,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#171420; --surface:#211c2c; --surface-2:#282232;
    --ink:#e9e2d3; --ink-soft:#b6ac99; --ink-faint:#7d7568; --line:#3a3546;
    --portal:#4fd6d0; --portal-soft:#1c3a38;
    --ember:#e79a5e; --ember-soft:#3d2a1b;
    --arcane:#b596ec; --arcane-soft:#332947;
    --good:#7fd19c; --good-soft:#1c3327;
    --bad:#e88585; --bad-soft:#3a1f1f;
    --shadow:rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper); color:var(--ink);
  font-family:'Source Serif 4', Georgia, serif; font-size:16px; line-height:1.5;
  padding-bottom:4rem;
}
h1,h2,h3,h4{font-family:'Cinzel','Source Serif 4',serif; font-weight:600; margin:0; color:var(--ink);}
.mono{font-family:'JetBrains Mono',monospace;}
button{
  font-family:'Source Serif 4', Georgia, serif; font-size:.95rem; cursor:pointer;
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  border-radius:8px; padding:.55rem 1rem; transition:.12s;
}
button:hover{border-color:var(--portal); color:var(--portal);}
button:disabled{opacity:.4; cursor:not-allowed;}
button.primary{background:var(--portal); border-color:var(--portal); color:#fff; font-weight:600;}
button.primary:hover{opacity:.9; color:#fff;}
button.danger{background:var(--bad); border-color:var(--bad); color:#fff;}
button.danger:hover{color:#fff; opacity:.85;}
button.small{padding:.32rem .6rem; font-size:.8rem; border-radius:6px;}
input,select{
  font-family:'Source Serif 4', Georgia, serif; font-size:.95rem;
  border:1px solid var(--line); border-radius:6px; padding:.4rem .6rem;
  background:var(--surface); color:var(--ink);
}
.wrap{max-width:1000px; margin:0 auto; padding:1.5rem 1rem 3rem;}
header.top{
  display:flex; align-items:center; justify-content:space-between; gap:1rem;
  padding:1rem 0 1.2rem; border-bottom:1px solid var(--line); margin-bottom:1.5rem; flex-wrap:wrap;
}
header.top .brand{display:flex; align-items:center; gap:.6rem;}
header.top .brand .dot{width:.6rem;height:.6rem;border-radius:50%;background:var(--portal); box-shadow:0 0 0 4px var(--portal-soft);}
header.top h1{font-size:1.5rem;}
header.top .sub{font-size:.78rem; color:var(--ink-faint); font-family:'JetBrains Mono',monospace;}
.topbar-actions{display:flex; gap:.5rem; flex-wrap:wrap;}

.hidden{display:none !important;}
.panel{
  background:var(--surface); border:1px solid var(--line); border-radius:10px;
  padding:1.2rem 1.3rem; margin-bottom:1.2rem;
}
.panel h2{font-size:1.1rem; margin-bottom:.8rem;}
.panel h3{font-size:.95rem; margin:0 0 .6rem;}
.row{display:flex; gap:.8rem; flex-wrap:wrap; align-items:center;}
.grid{display:grid; gap:1rem;}
.grid.cols-2{grid-template-columns:1fr 1fr;}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
@media (max-width:700px){ .grid.cols-2, .grid.cols-3{grid-template-columns:1fr;} }

/* ---- setup ---- */
.player-setup{border:1px dashed var(--line); border-radius:8px; padding:1rem; margin-bottom:.9rem; background:var(--surface-2);}
.player-setup .row{margin-bottom:.5rem;}
.class-desc{font-size:.82rem; color:var(--ink-soft); max-width:60ch;}
.class-card-preview{width:300px; max-width:100%; border-radius:12px; overflow:hidden; box-shadow:0 6px 18px var(--shadow); border:1px solid var(--line);}
.class-card-preview img{width:100%; display:block;}
.class-card-preview .class-card-fallback{padding:.8rem; background:var(--surface-2);}
.incontro-card-hero{width:min(92%, 560px); margin:0 auto 1rem; border-radius:14px; overflow:hidden; box-shadow:0 8px 24px var(--shadow); border:1px solid var(--line);}
.incontro-card-hero img{width:100%; display:block;}
.lvlup-star{text-align:center; font-size:1.7rem; line-height:1; margin-bottom:.3rem; text-shadow:0 0 14px var(--ember-soft);}
.lvlup-portrait{width:140px; height:140px; margin:0 auto .8rem; border-radius:50%; overflow:hidden; border:3px solid var(--ember); box-shadow:0 0 0 6px var(--ember-soft), 0 10px 24px var(--shadow);}
.lvlup-portrait img{width:100%; height:100%; object-fit:cover; object-position:50% 12%; display:block;}
.lvlup-portrait .lvlup-fallback{width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:3rem; background:var(--surface-2);}
.lvlup-title{text-align:center;}

/* ---- party bar ---- */
.party-bar{display:flex; gap:.8rem; flex-wrap:wrap; margin-bottom:1.2rem;}
.char-card{
  background:var(--surface); border:1px solid var(--line); border-radius:10px;
  padding:.8rem .9rem; min-width:220px; flex:1 1 220px; position:relative;
}
.char-card.dead{opacity:.45;}
.char-card.out{border-color:var(--bad);}
.char-card .cname{font-family:'Cinzel',serif; font-weight:600; font-size:1rem; display:flex; align-items:center; gap:.4rem;}
.char-card .ccls{font-size:.76rem; color:var(--ink-faint); font-family:'JetBrains Mono',monospace; margin-bottom:.5rem;}
.stat-dice{display:grid; grid-template-columns:repeat(6,1fr); gap:.3rem; margin-bottom:.5rem;}
.die{
  aspect-ratio:1; border-radius:6px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-family:'JetBrains Mono',monospace; font-weight:600; font-size:.85rem; border:1px solid var(--line); background:var(--surface-2);
  position:relative;
}
.die .lbl{font-size:.55rem; opacity:.6; text-transform:uppercase; letter-spacing:.03em;}
.die.pv{color:var(--bad);} .die.san{color:var(--arcane);} .die.anima{color:var(--portal);}
.die.debuff-t::after{content:"●"; position:absolute; top:2px; right:3px; font-size:.5rem; color:var(--ember);}
.die.debuff-p::after{content:"●"; position:absolute; top:2px; right:3px; font-size:.5rem; color:var(--bad);}
.die.boost-t::after{content:"▲"; position:absolute; top:2px; left:3px; font-size:.5rem; color:var(--good);}
.char-meta{font-size:.78rem; color:var(--ink-soft); display:flex; gap:.7rem; flex-wrap:wrap; margin-bottom:.4rem;}
.char-meta span{white-space:nowrap;}
.char-inv{font-size:.76rem; color:var(--ink-faint); max-height:3.4em; overflow:hidden;}
.char-actions{display:flex; gap:.3rem; flex-wrap:wrap; margin-top:.5rem;}
.badge{
  font-family:'JetBrains Mono',monospace; font-size:.65rem; letter-spacing:.04em; text-transform:uppercase;
  padding:.15rem .45rem; border-radius:99px; background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--line);
}
.badge.win{background:var(--good-soft); color:var(--good); border-color:var(--good);}
.badge.dead{background:var(--bad-soft); color:var(--bad); border-color:var(--bad);}

/* ---- cards ---- */
.card-display{display:flex; gap:1rem; align-items:flex-start; flex-wrap:wrap;}
.card-art-wrap{width:120px; height:168px; flex:none; position:relative; border-radius:10px; overflow:hidden; box-shadow:0 4px 14px var(--shadow); border:1px solid var(--line);}
.card-art-wrap img{width:100%; height:100%; object-fit:cover; display:block;}
.card-art-fallback{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.4rem;
  padding:.6rem; text-align:center;
}
.card-art-fallback .ic{font-size:2.1rem;}
.card-art-fallback .nm{font-family:'Cinzel',serif; font-size:.7rem; font-weight:600; line-height:1.2;}
.card-body{flex:1 1 280px; min-width:220px;}
.card-body h3{font-size:1.05rem; margin-bottom:.25rem;}
.card-body .tags{margin-bottom:.5rem;}
.card-body p{margin:0 0 .5rem; font-size:.92rem; color:var(--ink-soft); max-width:62ch;}

/* piano d'ingresso: immagine grande in formato scena panoramica (16:9), non la miniatura da carta */
.plane-hero{position:relative; width:100%; aspect-ratio:16/9; border-radius:14px; overflow:hidden; box-shadow:0 8px 26px var(--shadow); border:1px solid var(--line); margin-bottom:.9rem;}
.plane-hero img{width:100%; height:100%; object-fit:cover; display:block;}
.plane-hero-fallback{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:linear-gradient(160deg,var(--fam-soft),var(--surface-2)); color:var(--fam);}
.plane-hero-fallback .ic{font-size:4.5rem; filter:drop-shadow(0 4px 10px rgba(0,0,0,.25));}
.plane-hero-caption{position:absolute; left:0; right:0; bottom:0; padding:1rem 1.2rem; background:linear-gradient(to top, rgba(10,8,7,.82), rgba(10,8,7,0) 85%);}
.plane-hero-caption h2{margin:0; font-family:'Cinzel',serif; font-size:1.4rem; color:#f4ede0; text-shadow:0 2px 10px rgba(0,0,0,.5);}

/* family color coding */
.fam-elementare{--fam:#c1531f; --fam-soft:#f7e2d2;}
.fam-terrestre{--fam:#7a5a2e; --fam-soft:#ece1cc;}
.fam-demoniaco{--fam:#8f1f1f; --fam-soft:#f2d7d7;}
.fam-nonmorti{--fam:#3d5c40; --fam-soft:#dde8dc;}
.fam-eterei{--fam:#3a5aa8; --fam-soft:#dbe4f5;}
.fam-armonia{--fam:#b89323; --fam-soft:#f6edd2;}
.fam-entropia{--fam:#5f3f92; --fam-soft:#ece2f7;}
.fam-generico{--fam:#5f564a; --fam-soft:#e9e4da;}
.fam-oggetto{--fam:#a94f1e; --fam-soft:#f4e0cd;}
.fam-spell{--fam:#5f3f92; --fam-soft:#ece2f7;}
.fam-piano{--fam:#146b67; --fam-soft:#dcefec;}
.card-art-fallback{background:linear-gradient(160deg,var(--fam-soft),var(--surface-2)); color:var(--fam);}

/* ---- log ---- */
.log{
  max-height:260px; overflow-y:auto; font-size:.85rem; display:flex; flex-direction:column-reverse; gap:.3rem;
  background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:.7rem .9rem;
}
.log .entry{border-bottom:1px dotted var(--line); padding-bottom:.3rem;}
.log .entry:last-child{border-bottom:none;}
.log .t{color:var(--ink-faint); font-family:'JetBrains Mono',monospace; font-size:.7rem; margin-right:.4rem;}

/* ---- dice roll display ---- */
.roll-row{display:flex; gap:.5rem; flex-wrap:wrap; margin:.6rem 0;}
.roll-chip{
  display:flex; align-items:center; gap:.4rem; padding:.35rem .6rem; border-radius:8px;
  background:var(--surface-2); border:1px solid var(--line); font-size:.85rem;
}
.roll-chip.hit{border-color:var(--good); background:var(--good-soft); color:var(--good);}
.roll-chip.miss{opacity:.6;}
.roll-die{
  width:1.6rem; height:1.6rem; border-radius:5px; background:var(--ink); color:var(--paper);
  display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:.85rem;
}

/* manual resolution */
.manual-box{border:1px dashed var(--ember); background:var(--ember-soft); border-radius:8px; padding:.8rem 1rem; margin-top:.6rem;}
.manual-box h4{font-size:.85rem; color:var(--ember); margin-bottom:.5rem; font-family:'JetBrains Mono',monospace; text-transform:uppercase; letter-spacing:.04em;}
.manual-actions{display:flex; gap:.4rem; flex-wrap:wrap;}

/* tabs */
.tabs{display:flex; gap:.4rem; margin-bottom:1rem; flex-wrap:wrap;}
.tabs button.active{background:var(--portal); color:#fff; border-color:var(--portal);}

.hint{font-size:.8rem; color:var(--ink-faint); font-style:italic;}
.center{text-align:center;}
.mt1{margin-top:1rem;} .mb1{margin-bottom:1rem;}
.flex-between{display:flex; justify-content:space-between; align-items:center; gap:1rem; flex-wrap:wrap;}
select.stat-sel{width:auto;}
.item-chip{
  display:inline-flex; align-items:center; gap:.3rem; background:var(--surface-2); border:1px solid var(--line);
  border-radius:6px; padding:.15rem .5rem; font-size:.78rem; margin:.1rem .2rem .1rem 0;
}
.jump-counter{font-family:'JetBrains Mono',monospace; font-size:.85rem; color:var(--ink-faint);}
.card-row{display:flex; gap:.7rem; align-items:flex-start; padding:.6rem 0; border-bottom:1px dotted var(--line);}
.card-row:last-child{border-bottom:none;}
.card-row .thumb{width:46px; height:64px; flex:none; border-radius:6px; overflow:hidden; position:relative; border:1px solid var(--line);}
.card-row .thumb img{width:100%; height:100%; object-fit:cover; display:block;}
.card-row .thumb .ic{position:absolute; inset:0; display:none; align-items:center; justify-content:center; font-size:1.3rem; background:linear-gradient(160deg,var(--fam-soft,var(--surface-2)),var(--surface-2)); color:var(--fam,var(--ink-faint));}
.card-row .info{flex:1 1 auto; min-width:0;}
.card-row .info .title{font-weight:600; display:flex; gap:.4rem; align-items:center; flex-wrap:wrap;}
.card-row .info .desc{font-size:.82rem; color:var(--ink-soft); margin:.2rem 0 0;}
.card-row .actions{display:flex; gap:.3rem; flex-wrap:wrap; margin-top:.4rem;}
dialog#modalRoot{border:none; border-radius:12px; padding:0; background:transparent; max-width:560px; width:92vw;}
dialog#modalRoot::backdrop{background:rgba(20,15,10,.55);}
#modalInner{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:1.4rem 1.5rem; max-height:80vh; overflow-y:auto;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="dot"></span>
      <div>
        <h1>Planar Escape</h1>
        <div class="sub">Simulatore di playtest · v0.1</div>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="btnSave" class="small">💾 Salva</button>
      <button id="btnLoad" class="small">📂 Carica</button>
      <button id="btnReset" class="small danger">↺ Nuova partita</button>
    </div>
  </header>

  <div id="app"></div>
</div>

<dialog id="modalRoot"><div id="modalInner"></div></dialog>

<script>
/* =========================================================================
   PLANAR ESCAPE — motore di playtest
   Dati e regole tratti dal documento di design "Piani in Fuga / Planar Escape".
   Le carte con effetto molto specifico/narrativo sono marcate manual:true —
   il testo esatto viene mostrato e si risolve con un tap su pulsanti generici
   (danno, depotenziamento, oggetto, risorsa...) invece di essere "indovinato"
   dal motore. Tutto il resto (check, contese/combattimenti, mazzi, recupero,
   Follia/Corruzione, resistenze, progressione) è automatico.
   ========================================================================= */

const STATS = ["for","int","des","pv","san","anima"];
const STAT_LABEL = {for:"Forza",int:"Intelletto",des:"Destrezza",pv:"Punti Vita",san:"Sanità Mentale",anima:"Anima"};
const STAT_ICON = {for:"💪",int:"🧠",des:"🏃",pv:"❤️",san:"🌀",anima:"🕯️"};

/* ---------------- CLASSES ---------------- */
const CLASSES = {
  guerriero:{name:"Guerriero",icon:"⚔️",for:4,int:1,des:3,pv:5,san:5,anima:5,affinity:{},reroll:0,rerollLvl:0,weapons:"heavy",resistance:["elementare","terrestre"],stealth:false,
    desc:"Nessuno spell, ma armi e armature pesanti. Resistenza a tutto il Tipo Fisico (Elementare + Terrestre)."},
  barbaro:{name:"Barbaro",icon:"🪓",for:5,int:1,des:3,pv:4,san:5,anima:5,affinity:{},reroll:0,rerollLvl:0,weapons:"light",resistance:[],stealth:false,special:"furia",
    desc:"Furia brutale: ogni colpo a segno in Contese di Forza infligge 2 danni; un 6 naturale in qualsiasi Contesa infligge 2 danni. A 0 PV non sviene, resta attivo."},
  ladro:{name:"Ladro",icon:"🗡️",for:2,int:2,des:4,pv:3,san:5,anima:5,affinity:{},reroll:1,rerollLvl:0,weapons:"light",resistance:[],stealth:true,
    desc:"Furtività: può tentare di restare nascosto da un Incontro (check Destrezza). Classe ibrida: 1 reroll fisso."},
  veggente:{name:"Veggente",icon:"🔮",for:1,int:4,des:2,pv:3,san:5,anima:5,affinity:{divinazione:2,essenza:1},reroll:0,rerollLvl:0,weapons:"none",resistance:["eterei","entropia"],stealth:false,special:"vista_piani",
    desc:"Conosce la carta in cima al mazzo Piani prima di ogni salto (si ricarica trovando un piano di Recupero). Resistenza a Eterei + Entropia."},
  mago:{name:"Mago",icon:"🪄",for:1,int:4,des:2,pv:3,san:5,anima:5,affinity:{essenza:3},reroll:0,rerollLvl:0,weapons:"none",resistance:["elementare"],special:"dardo",
    desc:"Dardo Incantato: una volta per carica, 2 danni sicuri in una Contesa di Forza/Intelletto/Destrezza (ricarica a Recupero). Resistenza Elementare."},
  chierico:{name:"Chierico",icon:"🙏",for:2,int:3,des:2,pv:4,san:5,anima:6,affinity:{flusso:3},reroll:0,rerollLvl:0,weapons:"light",resistance:["armonia"],special:"cura_bonus",
    desc:"Abilità: il primo Flusso lanciato su un compagno dopo l'attivazione cura anche 1 PV extra (ricarica a Recupero). Anima iniziale 6. Resistenza Armonia."},
  druido:{name:"Druido",icon:"🌿",for:2,int:3,des:2,pv:4,san:5,anima:5,affinity:{flusso:1},reroll:0,rerollLvl:0,weapons:"light",resistance:["terrestre"],special:"forma_selvatica",waterOk:true,exitPlane:"flora_aliena",
    desc:"Forma Selvatica: scambia temporaneamente due caratteristiche (ricarica a Recupero). A proprio agio in acqua. Uscita personale: Flora Aliena."},
  warlock:{name:"Warlock",icon:"👹",for:2,int:3,des:2,pv:3,san:5,anima:5,affinity:{essenza:2},reroll:0,rerollLvl:0,weapons:"light",resistance:["demoniaco"],special:"evocazione",
    desc:"Evoca un demone minore come compagno personale (valore 1, ricarica a Recupero). Resistenza Demoniaco."},
  negromante:{name:"Negromante",icon:"☠️",for:1,int:4,des:2,pv:3,san:5,anima:5,affinity:{flusso:2,essenza:1},reroll:0,rerollLvl:0,weapons:"none",resistance:["nonmorti"],special:"resurrezione",
    desc:"Se muore, una sola volta a partita torna in vita come non-morto con 1 PV. Resistenza Non-morti."},
  sciamano:{name:"Sciamano",icon:"🏔️",for:1,int:3,des:3,pv:4,san:5,anima:5,affinity:{essenza:1,divinazione:1,flusso:1},reroll:0,rerollLvl:0,weapons:"light",resistance:["elementare"],waterOk:true,exitPlane:"eta_terra_antica",
    desc:"Generalista, un piede in ogni scuola. A proprio agio in acqua. Uscita personale: Età della Terra Antica. Resistenza Elementare."},
  saltimbanco:{name:"Saltimbanco",icon:"🎭",for:2,int:2,des:3,pv:4,san:5,anima:5,affinity:{},reroll:3,rerollLvl:2,weapons:"light",resistance:[],stealth:true,
    desc:"Nessuno spell: 3 reroll fissi (+2 per livello). Furtività come il Ladro."},
  monaco:{name:"Monaco",icon:"👊",for:3,int:2,des:3,pv:4,san:6,anima:6,affinity:{},reroll:1,rerollLvl:0,weapons:"light",resistance:[],waterOk:true,special:"resistenza_universale",
    desc:"San e Anima iniziali 6. Classe ibrida: 1 reroll fisso. Una volta per carica, annulla del tutto un danno su una qualsiasi caratteristica (ricarica a Recupero)."},
  paladino:{name:"Paladino",icon:"🛡️",for:3,int:2,des:2,pv:4,san:5,anima:5,affinity:{flusso:1},reroll:0,rerollLvl:0,weapons:"heavy",resistance:["armonia"],special:"paladino_extra",
    desc:"Armi e armature pesanti pur avendo un'affinità. A ogni avanzamento pesca anche una carta Flusso extra. Resistenza Armonia."},
};

/* ---------------- FAMILIES ---------------- */
const FAMILIES = {
  elementare:{name:"Elementare",icon:"🔥",type:"fisico"},
  terrestre:{name:"Terrestre",icon:"🌋",type:"fisico"},
  demoniaco:{name:"Demoniaco",icon:"👹",type:"etereo"},
  nonmorti:{name:"Non-morti",icon:"☠️",type:"etereo"},
  eterei:{name:"Eterei",icon:"🌙",type:"etereo"},
  armonia:{name:"Armonia",icon:"✨",type:"etereo"},
  entropia:{name:"Entropia",icon:"🌀",type:"etereo"},
  generico:{name:"Generico",icon:"🌐",type:"etereo"},
};

/* ---------------- MAZZO PIANI (36 carte) ---------------- */
function P(id,name,family,check,recupero,text,effectKey,extra){
  return Object.assign({id,name,family,check,recupero:!!recupero,text,effectKey:effectKey||id,deck:family==="demoniaco"?"demoni":(family==="nonmorti"?"nonmorti":family)},extra||{});
}
const PIANI = [

/* ========================= STATO DI GIOCO ========================= */
let state = null;

function freshDeckPiani(){
  const ids = PIANI.map(p=>p.id);
  return shuffle(ids);
}
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function d6(){ return 1+Math.floor(Math.random()*6); }

function newGame(){
  state = {
    players:[],
    mazzoPiani: freshDeckPiani(),
    subdecks: Object.fromEntries(Object.entries(INCONTRI).map(([k,v])=>[k, shuffle(v.map(c=>c.id))])),
    subdecksDiscard: Object.fromEntries(Object.keys(INCONTRI).map(k=>[k,[]])),
    oggettiDeck: shuffle(OGGETTI.map(o=>o.id)),
    spellDecks: Object.fromEntries(Object.entries(SPELLS).map(([k,v])=>[k, shuffle(v.map(s=>s.id))])),
    pianoTerrenoDeck: shuffle(PIANO_TERRENO.map(p=>p.id)),
    pianoTerrenoUsed: [],
    jumps:0,
    log:[],
    currentDraw:null, // {planeId, incontroId, phase}
    pendingPersistent:null, // {planeId, entities:[...]}
    gameOver:false,
    turnConsecutive:{}, // per Piano Negativo tracking: {planeId: n}
    groups:[], // [{id, memberIds:[...]}] — separazione: chi si divide forma un proprio gruppo
    currentGroupId:null, // il gruppo che sta facendo il proprio turno adesso
    pendingReunion:false, // Segnale di richiamo / Legame a distanza: il prossimo salto riunisce tutti
    pendingVaticinio:null, // {groupId, family}: scommessa attiva sulla Famiglia del prossimo salto
    pendingSferaAntiplanare:null, // {groupId}: annulla l'effetto intrinseco del prossimo piano in cui questo gruppo entra
    jumpedThisRound:{}, // {groupId:true}: gruppi separati che hanno già saltato in questo turno sincronizzato — si aspettano a vicenda
    pattoOnoreActive:false, // Patto d'Onore: da quando si prende la ricompensa, ogni vittoria in combattimento nell'Entropia frutta un oggetto
    amplifySpellsActive:false, // Amplificazione: +1 all'effetto di ogni spell di danno o cura lanciato, finché il gruppo non salta via
  };
  render();
}
function initGroups(){
  const gid = 'g_main';
  state.groups = [{ id:gid, memberIds: state.players.map(c=>c.id) }];
  state.currentGroupId = gid;
}

function logMsg(msg, kind){
  state.log.push({t:new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit',second:'2-digit'}), msg, kind:kind||''});
  if(state.log.length>400) state.log.shift();
}

/* ---------------- persistence ---------------- */
function saveGame(){
  try{ localStorage.setItem('planar_escape_save', JSON.stringify(state)); toast('Partita salvata.'); }
  catch(e){ toast('Impossibile salvare: '+e.message); }
}
function loadGame(){
  try{
    const raw = localStorage.getItem('planar_escape_save');
    if(!raw){ toast('Nessun salvataggio trovato.'); return; }
    state = JSON.parse(raw);
    toast('Partita caricata.');
    render();
  }catch(e){ toast('Impossibile caricare: '+e.message); }
}
function toast(msg){
  const el=document.createElement('div');
  el.textContent=msg;
  el.style.cssText='position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:.6rem 1rem;border-radius:8px;font-size:.85rem;z-index:999;box-shadow:0 4px 14px rgba(0,0,0,.3);';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2200);
}

document.getElementById('btnSave').onclick = saveGame;
document.getElementById('btnLoad').onclick = loadGame;
document.getElementById('btnReset').onclick = ()=>{ if(confirm('Iniziare una nuova partita? Lo stato attuale (non salvato) andrà perso.')) newGame(); };

/* ========================= CHARACTER HELPERS ========================= */
function makeChar(name, clsKey, bonus){
  const cls = CLASSES[clsKey];
  const c = {
    id: 'c'+Math.random().toString(36).slice(2,9),
    name, cls: clsKey,
    stats:{for:cls.for,int:cls.int,des:cls.des,pv:cls.pv,san:cls.san,anima:cls.anima},
    start:{for:cls.for,int:cls.int,des:cls.des,pv:cls.pv,san:cls.san,anima:cls.anima},
    tempDebuff:{for:false,int:false,des:false,san:false,anima:false},
    permDebuffN:{for:0,int:0,des:0,san:0,anima:0},
    inventory:[], // item ids
    equipped:{weapon:null,armor:null,shield:null,rings:[]},
    spells:[], // spell ids
    resources:0,
    rerolls:cls.reroll,
    jumps:0,
    level:1,
    status:'active', // active | unconscious | dead | undead | won
    winType:null,
    resistanceUsed:{}, // family -> bool used this plane-entry
    charges:{ special:true }, // class special charge available
    negromanteUsed:false,
    stealthedThisEncounter:false,
    pendingFollia:null, // 'salto' | 'trascina' — azione dovuta al prossimo turno
    pendingCorruzione:null, // 'contrario' | 'ostile' — azione dovuta al prossimo turno
    dardoReady:false, // Mago: prossima Contesa infligge 2 danni sicuri
    monkShieldReady:false, // Monaco: annulla il prossimo danno subito
    tempraReady:false, // Tempra: para il prossimo danno subito, qualsiasi tipo
    sagomaReady:false, // Sagoma Illusoria: assorbe la prossima perdita subita (danno, Anima/Sanità, depotenziamento), poi svanisce
    formaSelvaticaSwap:null, // Druido: [statA,statB] scambiate fino al prossimo salto
    mirrorBoost:null, // Labirinto degli Specchi: {stat:delta} da revertire dopo il prossimo piano
    pendingPersonalReunion:false, // Anello del Legame: al prossimo salto si riunisce col resto del gruppo
    egidaReady:false, // Egida: para il prossimo danno Fisico, fino al prossimo salto
    sigilloActive:false, // Sigillo: non può agire ostilmente per Corruzione, finché resta nel piano
    dmgBonusPlane:0, // Benedizione: +2 danno per tutta la permanenza nel piano
    ordineResetReady:false, // Ordine: può riportare una propria caratteristica al valore di partenza di 1° livello, finché resta nel piano
    skipNextIncontro:false, // perdita individuale del turno: escluso dal prossimo Incontro del gruppo, poi si consuma
    wildcardResistance:false, // Cimelio del Viandante/Vaticinio: para il primo danno d'ingresso del prossimo piano, qualunque famiglia
    contesaBonusPlane:0, // Vaticinio: +1 in qualsiasi Contesa per tutta la permanenza nel piano indovinato
    tempBonus:{}, // {stat:delta} da ricompensa Etereo non-boss: dura fino al prossimo Recupero
    corroded:{weapon:false,armor:false}, // Corrosione lenta: bonus dello slot sospeso fino al prossimo Recupero
    companion:null, // {name,value}: famiglio/compagno legato al personaggio (Giardino Pietrificato) — un solo valore, niente scheda separata
    protectedItemId:null, // Statua di Stasi: oggetto immune a qualsiasi perdita/furto/distruzione, un solo oggetto alla volta
    curaBonusReady:false, // Chierico: abilità attiva, il prossimo Flusso lanciato su un compagno cura anche 1 PV extra
    turnStartPv:null, // PV all'inizio del turno corrente, per Richiamo di sangue (chi ha già perso PV in questo turno)
    planeDebuff:{}, // Luce/Tenebre: depotenziamento per tutta la permanenza, non curabile a Recupero
    log:[],
  };
  if(bonus && bonus.stat){ c.stats[bonus.stat]=Math.min(6,c.stats[bonus.stat]+bonus.amount); c.start[bonus.stat]=c.stats[bonus.stat]; }
  // starting spells
  Object.entries(cls.affinity||{}).forEach(([school,n])=>{
    for(let i=0;i<n;i++){ const id = drawSpell(school); if(id) c.spells.push(id); }
  });
  return c;
}
function drawSpell(school){
  const deck = state.spellDecks[school];
  if(!deck || deck.length===0) return null;
  return deck.shift();
}
function drawOggetto(){
  if(state.oggettiDeck.length===0){ logMsg('Il mazzo Oggetti è esaurito!','warn'); return null; }
  return state.oggettiDeck.shift();
}
function statFloor(stat){ return stat==='pv' ? 0 : 1; }

function applyDamage(c, stat, n, ctx){
  if(c.status==='dead') return;
  ctx = ctx||{};
  if(n>0 && c.monkShieldReady){
    c.monkShieldReady=false;
    logMsg(`🧘 ${c.name} annulla del tutto il danno a ${STAT_LABEL[stat]} con la Resistenza universale.`);
    return;
  }
  if(n>0 && c.egidaReady && ctx.type==='fisico'){
    c.egidaReady=false;
    logMsg(`🛡️ ${c.name} para il colpo grazie a Egida.`);
    return;
  }
  if(n>0 && c.tempraReady){
    c.tempraReady=false;
    logMsg(`🛡️ ${c.name} para il colpo grazie a Tempra.`);
    return;
  }
  if(n>0 && c.sagomaReady){
    c.sagomaReady=false;
    logMsg(`👤 ${c.name} assorbe il colpo con Sagoma Illusoria, che poi svanisce.`);
    return;
  }
  // resistenza: block first hit of the plane-entry if applicable and physical/type match
  if(!ctx.ignoreResistance && n>0 && checkResistanceBlocks(c, ctx)){
    logMsg(`🛡️ ${c.name} para il colpo grazie alla Resistenza.`);
    return;
  }
  if(!ctx.ignoreResistance && n>0 && checkItemEntryBlock(c, ctx)) return;
  if(!ctx.ignoreResistance && n>0 && c.wildcardResistance){
    c.wildcardResistance=false;
    logMsg(`🍀 ${c.name} para il colpo: Resistenza garantita per questo piano.`);
    return;
  }
  if(n>0 && state.currentDraw && state.currentDraw.cerchioActive){
    state.currentDraw.cerchioActive=false;
    logMsg(`🛡️ Il gruppo para il colpo grazie al Cerchio di Protezione.`);
    return;
  }
  if(n>0 && c.equipped.shield){
    const sh = OGGETTI_BY_ID[c.equipped.shield];
    if(sh && (sh.blockFirstHitAnyType || (sh.blockFirstHitPhysical && ctx.type==='fisico'))){
      if(c.equipped.shield===c.protectedItemId){
        logMsg(`🛡️⏳ ${c.name} para il colpo con ${sh.name}: la Statua di Stasi lo protegge, non si rompe.`,'good');
      } else {
        logMsg(`🛡️ ${c.name} para il colpo con ${sh.name}, che poi si rompe.`);
        c.equipped.shield=null;
      }
      return;
    }
  }
  const before = c.stats[stat];
  let val = before - n;
  const floor = statFloor(stat);
  if(stat==='pv'){
    // Eternità: "qui nulla viene mai consumato né dimenticato" — si può ancora prendere
    // danno, ma i PV non scendono mai sotto 1: niente svenimento, niente morte, su questo piano.
    const p = currentPlane();
    if(p && p.id==='eternita' && val<1){
      val = 1;
      logMsg(`⏳ ${c.name}: l'Eternità non lo lascia scendere sotto 1 Punto Vita.`,'good');
    }
    if(val<=0 && val>-999){ /* handled below */ }
  } else {
    if(val<floor) val=floor;
  }
  c.stats[stat]=val;
  logMsg(`💥 ${c.name} subisce ${n} danno a ${STAT_LABEL[stat]} (${before} → ${Math.max(val,stat==='pv'?val:floor)}).`);
  if(stat==='pv'){
    handlePvThreshold(c);
  }
}
function checkResistanceBlocks(c, ctx){
  if(!ctx.family && !ctx.type) return false;
  const cls = CLASSES[c.cls];
  const fam = ctx.family;
  const hasFam = fam && cls.resistance.includes(fam);
  if(!hasFam) return false;
  if(c.resistanceUsed[fam]) return false;
  c.resistanceUsed[fam]=true;
  return true;
}
function resetResistanceForPlane(c){
  // "si ricarica a ogni ingresso": ogni blocco-primo-danno (Resistenza di classe
  // e oggetti passivi di protezione) si ricarica per intero a ogni nuovo ingresso.
  c.resistanceUsed = {};
}
function checkItemEntryBlock(c, ctx){
  if(!ctx.planeId && !ctx.family && !ctx.type && !ctx.combat) return false;
  const items = [c.equipped.armor, ...(c.equipped.rings||[])].filter(Boolean);
  for(const id of items){
    const it = OGGETTI_BY_ID[id]; if(!it) continue;
    const key = 'item:'+id;
    if(c.resistanceUsed[key]) continue;
    let matches=false;
    if(it.blockPlane){
      const planes = Array.isArray(it.blockPlane)?it.blockPlane:[it.blockPlane];
      if(ctx.planeId && planes.includes(ctx.planeId)) matches=true;
    }
    if(it.blockEntryType && ctx.type===it.blockEntryType) matches=true;
    if(it.blockEntryFamily && ctx.family===it.blockEntryFamily) matches=true;
    if(it.blockFirstHitCombatAlways && ctx.combat) matches=true;
    if(matches){ c.resistanceUsed[key]=true; logMsg(`🛡️ ${c.name} para il colpo grazie a ${it.name}.`); return true; }
  }
  // gli oggetti "protezione" passivi (amuleti, ciondoli) proteggono anche solo tenuti in inventario
  for(const id of c.inventory){
    const it = OGGETTI_BY_ID[id]; if(!it || it.cat!=='protezione') continue;
    const key = 'item:'+id;
    if(c.resistanceUsed[key]) continue;
    let matches=false;
    if(it.blockPlane){
      const planes = Array.isArray(it.blockPlane)?it.blockPlane:[it.blockPlane];
      if(ctx.planeId && planes.includes(ctx.planeId)) matches=true;
    }
    if(it.blockEntryType && ctx.type===it.blockEntryType) matches=true;
    if(it.blockEntryFamily && ctx.family===it.blockEntryFamily) matches=true;
    if(it.blockFirstHitCombatAlways && ctx.combat) matches=true;
    if(matches){ c.resistanceUsed[key]=true; logMsg(`🛡️ ${c.name} para il colpo grazie a ${it.name}.`); return true; }
  }
  return false;
}
function handlePvThreshold(c){
  const cls=CLASSES[c.cls];
  if(c.stats.pv<=0 && c.stats.pv>-1 && c.status==='active'){
    if(cls.special==='furia' ){ /* Barbaro: 0 non sviene */ }
    else {
      const savior = state.players.find(p=>isConscious(p) && p.spells.includes('sp_rinascita'));
      if(savior){
        savior.spells.splice(savior.spells.indexOf('sp_rinascita'),1);
        c.stats.pv=1;
        logMsg(`✨ Rinascita (in mano a ${savior.name}) scatta: ${c.name} torna in piedi con 1 PV invece di svenire.`,'good');
      } else {
        const group = groupOf(c);
        const companions = group ? group.memberIds.filter(id=>id!==c.id).map(id=>state.players.find(p=>p.id===id)).filter(isConscious) : [];
        if(companions.length===0){
          c.status='dead';
          logMsg(`💀 ${c.name} sviene a 0 Punti Vita da solo, senza nessuno che possa portarlo via: muore.`,'bad');
        } else {
          c.status='unconscious'; logMsg(`😵 ${c.name} sviene a 0 Punti Vita. Il gruppo può portarlo con sé.`,'bad');
        }
      }
    }
  }
  if(c.stats.pv<0){
    if(cls.special==='resurrezione' && !c.negromanteUsed){
      c.negromanteUsed=true; c.status='undead'; c.stats.pv=1;
      logMsg(`☠️ ${c.name} muore ma torna come non-morto con 1 PV (una sola volta).`,'warn');
    } else {
      c.status='dead';
      logMsg(`☠️ ${c.name} muore.`,'bad');
    }
  }
}
function applyTempDebuff(c, stat){
  if(stat==='pv'){ applyDamage(c,'pv',1,{ignoreResistance:true}); return; }
  if(c.sagomaReady){
    c.sagomaReady=false;
    logMsg(`👤 ${c.name} assorbe il depotenziamento con Sagoma Illusoria, che poi svanisce.`);
    return;
  }
  if(c.tempDebuff[stat]){
    c.permDebuffN[stat]++;
    c.stats[stat]=Math.max(1,c.stats[stat]-1);
    logMsg(`⬇️ ${c.name}: nuovo depotenziamento a ${STAT_LABEL[stat]} già attivo → diventa PERMANENTE.`,'bad');
  } else {
    c.tempDebuff[stat]=true;
    c.stats[stat]=Math.max(1,c.stats[stat]-1);
    logMsg(`⬇️ ${c.name} subisce un depotenziamento TEMPORANEO a ${STAT_LABEL[stat]} (guarisce a Recupero).`);
  }
}
function applyPermDebuff(c, stat){
  if(stat==='pv'){ applyDamage(c,'pv',1,{ignoreResistance:true}); return; } // niente "permDebuffN.pv": il PV non ha quel contatore, è danno diretto
  if(c.sagomaReady){
    c.sagomaReady=false;
    logMsg(`👤 ${c.name} assorbe il depotenziamento con Sagoma Illusoria, che poi svanisce.`);
    return;
  }
  c.permDebuffN[stat]++;
  c.stats[stat]=Math.max(1,c.stats[stat]-1);
  logMsg(`⬇️⬇️ ${c.name} subisce un depotenziamento PERMANENTE a ${STAT_LABEL[stat]}.`,'bad');
}
function applyTempBonus(c, stat, n){
  n = n||1;
  if(c.tempBonus && c.tempBonus[stat]){
    // stesso identico comportamento dei depotenziamenti: un secondo bonus temporaneo
    // sulla stessa statistica, mentre il primo è ancora attivo, diventa PERMANENTE
    // (il bonus temporaneo originale resta com'era, si cura comunque a Recupero).
    const before=c.stats[stat]; c.stats[stat]=Math.min(6,c.stats[stat]+n);
    c.start[stat]=Math.min(6,c.start[stat]+n); // +n sul baseline, non "= al valore corrente" (che include ancora il bonus temporaneo non suo)
    logMsg(`🎁 ${c.name}: nuovo bonus a ${STAT_LABEL[stat]} già attivo → diventa PERMANENTE (${before} → ${c.stats[stat]}).`,'good');
  } else {
    const before=c.stats[stat]; c.stats[stat]=Math.min(6,c.stats[stat]+n);
    c.tempBonus[stat]=(c.tempBonus[stat]||0)+(c.stats[stat]-before);
    logMsg(`🎁 ${c.name} ottiene +${n} temporaneo a ${STAT_LABEL[stat]} (dura fino al prossimo Recupero).`);
  }
}
function applyOrdineReset(c, stat){
  const before = c.stats[stat];
  c.stats[stat] = c.start[stat];
  if(stat!=='pv'){ c.tempDebuff[stat]=false; c.permDebuffN[stat]=0; }
  c.ordineResetReady = false;
  logMsg(`⚖️ ${c.name} riporta ${STAT_LABEL[stat]} al valore di partenza di 1° livello (${before} → ${c.stats[stat]}), cancellando ogni effetto accumulato.`,'good');
}
function healStat(c, stat, n){
  const cap = stat==='pv'||stat==='san'||stat==='anima' ? c.start[stat] : 6;
  const before=c.stats[stat];
  c.stats[stat]=Math.min(cap, c.stats[stat]+n);
  if(c.stats[stat]!==before) logMsg(`💚 ${c.name} recupera ${STAT_LABEL[stat]} (${before} → ${c.stats[stat]}).`);
  if(stat==='pv' && c.status==='unconscious' && c.stats.pv>0){
    c.status='active';
    logMsg(`✨ ${c.name} torna cosciente.`,'good');
  }
}
function cureOneDebuff(c, stat){
  if(!c.tempDebuff[stat]) return false;
  c.tempDebuff[stat]=false;
  c.stats[stat]=Math.min(c.start[stat], c.stats[stat]+1);
  logMsg(`✨ ${c.name}: depotenziamento temporaneo a ${STAT_LABEL[stat]} guarito.`);
  return true;
}
function activeTempDebuffs(c){ return STATS.filter(s=>s!=='pv'&&c.tempDebuff[s]); }

function checkRoll(c, stat, opts){
  opts=opts||{};
  const val = effectiveStat(c,stat);
  if(c.status==='unconscious'){
    // uno svenuto non può agire: qualsiasi check tentato fallisce automaticamente, senza nemmeno tirare.
    return {roll:null, val, success:false};
  }
  let roll = d6();
  let success = roll<=val || roll===6;
  while(!success && c.rerolls>0){
    if(!confirm(`${c.name}: check di ${STAT_LABEL[stat]} fallito (${roll} vs ${val}). Usare 1 reroll? (${c.rerolls} disponibile/i)`)) break;
    c.rerolls--;
    roll = d6();
    success = roll<=val || roll===6;
    logMsg(`🔁 ${c.name} usa un reroll sul check di ${STAT_LABEL[stat]}: nuovo tiro ${roll} vs ${val} → ${success?'superato':'ancora fallito'} (${c.rerolls} reroll rimasti).`);
  }
  return {roll, val, success};
}
function effectiveStat(c, stat){
  let v = c.stats[stat];
  // equipped bonuses
  ['weapon','armor','shield'].forEach(slot=>{
    const id=c.equipped[slot]; if(!id) return;
    if(c.corroded && c.corroded[slot]) return; // Corrosione lenta: bonus sospeso fino al prossimo Recupero
    const it=OGGETTI_BY_ID[id]; if(!it) return;
    if(it.statKey===stat) v+=it.statBonus||0;
    if(it.statKey2===stat) v+=it.statBonus||0;
    if(it.statKey3===stat) v+=it.statBonus||0;
    if(it.secondaryStatKey===stat) v+=it.secondaryStatBonus||0;
  });
  c.equipped.rings.forEach(id=>{
    const it=OGGETTI_BY_ID[id]; if(!it) return;
    if(it.statKey===stat) v+=it.statBonus||0;
  });
  if(c.contesaBonusPlane) v += c.contesaBonusPlane; // Vaticinio: +1 in qualsiasi Contesa per la permanenza
  if(c.companion) v = Math.max(v, c.companion.value); // il compagno aiuta in qualsiasi check: si usa il valore migliore fra i due
  return Math.min(6,v);
}
function damageBonusFor(c, stat){
  let b=0;
  ['weapon','armor','shield'].forEach(slot=>{
    const id=c.equipped[slot]; if(!id) return;
    const it=OGGETTI_BY_ID[id]; if(!it) return;
    if(it.dmgBonus && (it.statKey===stat||it.statKey2===stat||it.statKey3===stat)) b+=it.dmgBonus;
    if(it.dmgBonusAny) b+=it.dmgBonusAny;
  });
  c.equipped.rings.forEach(id=>{ const it=OGGETTI_BY_ID[id]; if(it && it.dmgBonusAny) b+=it.dmgBonusAny; });
  return b;
}

function render(){
  const app = document.getElementById('app');
  if(!state){ app.innerHTML = renderSetup(); bindSetup(); return; }
  app.innerHTML = renderGame();
  bindGame();
}

function bindSetup(){
  document.querySelectorAll('.pname').forEach(el=>el.oninput=e=>{setupPlayers[+e.target.dataset.idx].name=e.target.value;});
  document.querySelectorAll('.pclass').forEach(el=>el.onchange=e=>{setupPlayers[+e.target.dataset.idx].cls=e.target.value; render();});
  document.querySelectorAll('.pbonus').forEach(el=>el.onchange=e=>{setupPlayers[+e.target.dataset.idx].bonusStat=e.target.value;});
  document.querySelectorAll('[data-remove]').forEach(el=>el.onclick=e=>{setupPlayers.splice(+e.target.dataset.remove,1); render();});
  document.getElementById('addPlayer').onclick=()=>{
    if(setupPlayers.length>=5) return;
    const usedClasses = setupPlayers.map(p=>p.cls);
    const freeCls = Object.keys(CLASSES).find(k=>!usedClasses.includes(k)) || 'guerriero';
    setupPlayers.push({name:'Giocatore '+(setupPlayers.length+1), cls:freeCls});
    render();
  };
  document.getElementById('startGame').onclick=()=>{
    newGame();
    const n=setupPlayers.length;
    const bonusAmount = n===1?2:(n===2?1:0);
    setupPlayers.forEach(p=>{
      const bonus = bonusAmount>0 && p.bonusStat ? {stat:p.bonusStat, amount:bonusAmount} : null;
      state.players.push(makeChar(p.name||('Eroe'), p.cls, bonus));
    });
    initGroups();
    logMsg('🌀 Il party fugge attraverso il portale. Inizia l\'avventura!');
    render();
  };
}

function applyVuotoLoss(c, what){
  // per 'pv' non logghiamo noi l'esito: applyDamage racconta già da sé cosa succede
  // davvero (danno subito, oppure parato da Cerchio/Egida/Tempra/Sagoma/Resistenza) —
  // un messaggio fisso "sceglie di perdere 1 PV" qui sopra sarebbe fuorviante quando
  // il colpo viene parato subito dopo.
  if(what==='pv'){ applyDamage(c,'pv',1,{ignoreResistance:true}); }
  else if(what==='item' && c.inventory.length){ const idx=Math.floor(Math.random()*c.inventory.length); const lost=c.inventory.splice(idx,1)[0]; logMsg(`🕳️ ${c.name} sceglie di perdere ${OGGETTI_BY_ID[lost]?.name}.`); }
  else if(what==='spell' && c.spells.length){ const idx=Math.floor(Math.random()*c.spells.length); const lost=c.spells.splice(idx,1)[0]; logMsg(`🕳️ ${c.name} sceglie di dimenticare ${SPELLS_BY_ID[lost]?.name}.`); }
  else if(what==='ability'){
    if(c.rerolls>0){ c.rerolls--; logMsg(`🕳️ ${c.name} sceglie di perdere 1 reroll.`); }
    else if(CLASSES[c.cls].special && c.charges.special){ c.charges.special=false; logMsg(`🕳️ ${c.name} sceglie di scaricare la propria abilità di classe.`); }
  }
}

/* ---------------- DRAW / RESOLUTION FLOW ---------------- */
function reinsertPianoCard(id){
  // "le carte Piano risolte tornano nel mazzo (si ributtano dentro)": nessuna garanzia
  // di non-ripetizione, quindi la stessa carta può ripresentarsi già al turno successivo.
  const pos = Math.floor(Math.random()*(state.mazzoPiani.length+1));
  state.mazzoPiani.splice(pos,0,id);
}
function doJump(){
  state.amplifySpellsActive = false; // la finestra di Amplificazione si chiude appena si salta via
  if(state.pendingReunion && state.groups.length>1){
    mergeAllGroups();
    state.pendingReunion=false;
    logMsg('🔗 Il segnale di richiamo funziona: tutti i separati si ritrovano, il gruppo si riunisce prima di saltare.','good');
  }
  activeChars().forEach(c=>{
    if(c.pendingPersonalReunion){
      c.pendingPersonalReunion=false;
      const myGroup = groupOf(c);
      const other = myGroup && largestOtherGroup(myGroup);
      if(other){
        logMsg(`💍 L'Anello del Legame di ${c.name} funziona: il suo gruppo si riunisce con il resto.`,'good');
        mergeGroups(other.id, myGroup.id);
      }
    }
  });
  applyPendingMadnessActions();
  activeChars().forEach(c=>{ revertFormaSelvatica(c); revertMirrorBoost(c); revertPlaneDebuffs(c); revertPerPlaneBuffs(c); });
  if(state.currentGroupId){
    state.jumpedThisRound[state.currentGroupId] = true;
    maybeResetJumpRound();
  }
  state.jumps++;
  // insert a Piano Terreno marker at the bottom for this jump
  state.mazzoPiani.push('__PT__');
  if(state.mazzoPiani.length===0) state.mazzoPiani = freshDeckPiani();
  const drawnId = state.mazzoPiani.shift();
  const jumpers = activeChars();
  jumpers.forEach(c=>{ c.turnStartPv = c.stats.pv; }); // Richiamo di sangue: chi ha già perso PV in questo turno
  jumpers.forEach(c=>{ c.jumps++; checkLevelUp(c); });
  if(drawnId==='__PT__'){
    processLevelUpQueue();
    resolvePianoTerreno();
    return;
  }
  const plane = PIANI_BY_ID[drawnId];
  reinsertPianoCard(drawnId);
  state.currentDraw = { planeId: drawnId, phase:'plane', log:[] };
  // reset resistance charge per questo ingresso, solo per il gruppo che sta saltando
  jumpers.forEach(c=> resetResistanceForPlane(c, plane.family));
  if(state.pendingSferaAntiplanare && state.pendingSferaAntiplanare.groupId===state.currentGroupId){
    state.pendingSferaAntiplanare = null;
    state.currentDraw.sferaSuppressed = true;
  }
  if(state.pendingVaticinio && state.pendingVaticinio.groupId===state.currentGroupId){
    const guess = state.pendingVaticinio; state.pendingVaticinio = null;
    if(guess.family===plane.family){
      jumpers.forEach(c=>{ c.wildcardResistance=true; c.contesaBonusPlane=(c.contesaBonusPlane||0)+1; });
      logMsg(`🔮 Vaticinio si avvera: il gruppo ottiene Resistenza e +1 in qualsiasi Contesa per tutta la permanenza in ${plane.name}.`,'good');
    } else {
      logMsg(`🔮 Vaticinio non si avvera: ${plane.name} non è di Famiglia ${FAMILIES[guess.family]?.name}.`,'warn');
    }
  }
  // track consecutive turns in same girone plane for Piano Negativo
  if(plane.family==='nonmorti'){
    state.turnConsecutive[drawnId] = (state.turnConsecutive[drawnId]||0)+1;
  } else {
    state.turnConsecutive={};
  }
  logMsg(`🚪 Il gruppo salta: <strong>${plane.name}</strong>.`);
  // eventuali passaggi di livello vanno confermati PRIMA di offrire la protezione pre-piano:
  // altrimenti la modale di livello verrebbe sovrascritta da quella di Cerchio/Egida appena
  // aperta, senza che il giocatore abbia fatto in tempo a vederla.
  processLevelUpQueue(()=>openPrePlaneProtectionModal(plane, jumpers));
}
function openPrePlaneProtectionModal(plane, jumpers){
  // Cerchio di Protezione ed Egida proteggono dal PROSSIMO danno subito, ma se si potessero
  // lanciare solo dal pannello Gestisci non ci sarebbe mai una vera finestra utile: l'effetto
  // d'ingresso del piano (es. il danno di Fuoco) scatterebbe già prima che il giocatore possa
  // reagire. Qui, appena il gruppo sa su che piano è atterrato ma prima che l'effetto
  // d'ingresso si applichi, si offre la scelta a chi ha uno dei due spell in mano.
  const holders = [];
  jumpers.forEach(c=>{
    c.spells.forEach((spId,idx)=>{ if(spId==='sp_cerchio'||spId==='sp_egida') holders.push({c, idx, spId}); });
  });
  if(holders.length===0){ applyPlaneIntrinsic(plane); render(); return; }
  openModal(`<h3>🛡️ Prima che ${escapeHtml(plane.name)} faccia effetto</h3>
    <p>Il gruppo è arrivato su <strong>${escapeHtml(plane.name)}</strong>. C'è ancora un istante per lanciare una protezione prima che l'effetto d'ingresso del piano si applichi — dopo non si può più tornare indietro.</p>
    <div class="row">${holders.map(({c,idx,spId})=>`<button class="small" data-preplane="${c.id}::${idx}::${spId}">${escapeHtml(SPELLS_BY_ID[spId].name)} (${escapeHtml(c.name)})</button>`).join('')}</div>
    <div class="row mt1"><button class="primary" id="btnPreplaneContinue">Continua, non usare nulla</button></div>`);
  document.querySelectorAll('[data-preplane]').forEach(b=>b.onclick=()=>{
    const [cid,idxStr,spId] = b.dataset.preplane.split('::');
    const c = jumpers.find(x=>x.id===cid); const idx=+idxStr;
    if(spId==='sp_cerchio'){
      state.currentDraw.cerchioActive = true;
      c.spells.splice(idx,1);
      logMsg(`🛡️ ${c.name} lancia Cerchio di Protezione prima che ${plane.name} faccia effetto: il gruppo parerà il primo danno.`,'good');
      closeModal();
      applyPlaneIntrinsic(plane);
      render();
    } else {
      openModal(`<h3>🛡️ Egida</h3><p>Scegli il bersaglio: parerà sempre il primo danno di Tipo Fisico subito, fino al prossimo salto.</p>
        <div class="row">${jumpers.map(t=>`<button class="small" data-preplaneegida="${t.id}">${escapeHtml(t.name)}</button>`).join('')}</div>`);
      document.querySelectorAll('[data-preplaneegida]').forEach(bb=>bb.onclick=()=>{
        const t=jumpers.find(x=>x.id===bb.dataset.preplaneegida);
        t.egidaReady = true;
        c.spells.splice(idx,1);
        logMsg(`🛡️ ${c.name} lancia Egida su ${t.name} prima che ${plane.name} faccia effetto.`,'good');
        closeModal();
        applyPlaneIntrinsic(plane);
        render();
      });
    }
  });
  document.getElementById('btnPreplaneContinue').onclick=()=>{ closeModal(); applyPlaneIntrinsic(plane); render(); };
}
function startJump(){
  // "Party al completo, tutti per la manina": SOLO se il gruppo che salta comprende
  // tutti i personaggi attivi, l'unità del gruppo rivela la carta Piano in cima al
  // mazzo prima di saltare. Un sottogruppo o un solitario saltano alla cieca (a meno
  // che non abbiano un Veggente, la cui abilità di classe funziona comunque a parte).
  const isFullParty = activeChars().length>0 && activeChars().length===allActiveChars().length;
  if(!isFullParty){ doJump(); return; }
  const nextId = state.mazzoPiani[0];
  const isPT = nextId==='__PT__';
  const nextPlane = isPT ? null : PIANI_BY_ID[nextId];
  const label = isPT ? 'Una destinazione leggendaria del Piano Terreno' : (nextPlane?.name || '?');
  openModal(`<h3>🤝 Il gruppo si tiene per mano</h3>
    <p>Uniti, vedete la carta in cima al mazzo Piani prima di saltare — resta quella la destinazione, non è una scelta:</p>
    ${nextPlane ? planeHeroArt(nextPlane) : ''}
    <p style="font-size:1.3rem;font-family:'Cinzel',serif;text-align:center;margin:1rem 0;">${escapeHtml(label)}</p>
    <div class="row mt1"><button class="primary" id="btnConfirmJump">🌀 Salta</button></div>`);
  const btn=document.getElementById('btnConfirmJump');
  if(btn) btn.onclick=()=>{ closeModal(); doJump(); };
}
function checkLevelUp(c){
  if(c.jumps>0 && c.jumps%5===0){
    c.level++;
    logMsg(`⭐ ${c.name} avanza di livello (Lv ${c.level})! +1 a scelta e progresso di classe.`);
    // in coda: se più personaggi salgono di livello nello stesso salto sincronizzato,
    // aprire subito una modale per ciascuno le sovrascriverebbe a vicenda — solo l'ultima
    // resterebbe visibile, e gli altri perderebbero silenziosamente scelta e progresso.
    state.pendingLevelUps = state.pendingLevelUps || [];
    state.pendingLevelUps.push(c.id);
  }
}
function processLevelUpQueue(onDone){
  if(!state.pendingLevelUps || state.pendingLevelUps.length===0){ if(onDone) onDone(); return; }
  const id = state.pendingLevelUps.shift();
  const c = state.players.find(p=>p.id===id);
  if(!c){ processLevelUpQueue(onDone); return; }
  openLevelUpModal(c, onDone);
}
function openLevelUpModal(c, onDone){
  const cls=CLASSES[c.cls];
  openModal(`<div class="lvlup-star">⭐</div>
    <div class="lvlup-portrait"><img src="assets/cards/${c.cls}.png" alt="" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"><div class="lvlup-fallback" style="display:none;">${cls.icon}</div></div>
    <h3 class="lvlup-title">Avanzamento di livello — ${escapeHtml(c.name)}</h3>
    <p>Scegli su quale caratteristica applicare <strong>+1</strong>:</p>
    <div class="row">${STATS.map(s=>`<button class="small" data-lvlstat="${s}">${STAT_LABEL[s]} (${c.stats[s]})</button>`).join('')}</div>
    <p class="mt1 hint">Progresso di classe: ${classProgressText(c.cls)}</p>
    <div class="row mt1"><button class="primary" id="lvlConfirm">Applica progresso di classe e continua</button></div>`);
  document.querySelectorAll('[data-lvlstat]').forEach(b=>b.onclick=()=>{
    const s=b.dataset.lvlstat; c.stats[s]=Math.min(6,c.stats[s]+1); c.start[s]=Math.max(c.start[s], c.stats[s]);
    b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('primary'));
    b.classList.add('primary');
  });
  document.getElementById('lvlConfirm').onclick=()=>{ applyClassProgress(c); closeModal(); render(); processLevelUpQueue(onDone); };
}
function classProgressText(clsKey){
  const map={
    guerriero:"Un oggetto gratuito.", barbaro:"Un oggetto gratuito.",
    ladro:"1 risorsa planare + 1 reroll fisso.", veggente:"1 carta spell di Divinazione.",
    mago:"1 carta spell di Essenza.", chierico:"1 carta spell di Flusso.",
    druido:"1 carta spell di Flusso.", warlock:"1 carta spell di Essenza.",
    negromante:"1 carta spell a scelta fra Flusso o Essenza.", sciamano:"1 carta spell a scelta fra Flusso, Essenza o Divinazione.",
    saltimbanco:"2 reroll fissi.", monaco:"1 risorsa planare + 1 reroll fisso.", paladino:"1 carta spell di Flusso.",
  };
  return map[clsKey];
}
function applyClassProgress(c){
  switch(c.cls){
    case 'guerriero': case 'barbaro': { const it=drawOggetto(); if(it) c.inventory.push(it); logMsg(`🎁 ${c.name} riceve un oggetto gratuito.`); break; }
    case 'ladro': c.resources++; c.rerolls++; break;
    case 'veggente': { const s=drawSpell('divinazione'); if(s) c.spells.push(s); break; }
    case 'mago': { const s=drawSpell('essenza'); if(s) c.spells.push(s); break; }
    case 'chierico': case 'druido': case 'paladino': { const s=drawSpell('flusso'); if(s) c.spells.push(s); break; }
    case 'warlock': { const s=drawSpell('essenza'); if(s) c.spells.push(s); break; }
    case 'negromante': { const school=Math.random()<0.5?'flusso':'essenza'; const s=drawSpell(school); if(s) c.spells.push(s); break; }
    case 'sciamano': { const schools=['flusso','essenza','divinazione']; const school=schools[Math.floor(Math.random()*3)]; const s=drawSpell(school); if(s) c.spells.push(s); break; }
    case 'saltimbanco': c.rerolls+=2; break;
    case 'monaco': c.resources++; c.rerolls++; break;
  }
  c.charges.special = true; // rough: level-up also refreshes charge (bonus, not RAW but reasonable)
}

/* -------- plane intrinsic effects -------- */
function isConscious(p){ return p && (p.status==='active'||p.status==='undead'); }
function allActiveChars(){ return state.players.filter(isConscious); }
function ensureGroups(){
  // compatibilità con salvataggi vecchi senza gruppi, o con personaggi non ancora assegnati
  if(!state.groups) state.groups=[];
  if(!state.jumpedThisRound) state.jumpedThisRound={};
  const assigned = new Set(state.groups.flatMap(g=>g.memberIds));
  const orphans = state.players.filter(p=>!assigned.has(p.id)).map(p=>p.id);
  if(orphans.length){
    if(state.groups.length===0) state.groups.push({id:'g_main', memberIds:[]});
    state.groups[0].memberIds.push(...orphans);
  }
  state.groups = state.groups.filter(g=>g.memberIds.length>0);
  if(!state.currentGroupId || !state.groups.some(g=>g.id===state.currentGroupId)){
    state.currentGroupId = state.groups[0] ? state.groups[0].id : null;
  }
}
function currentGroup(){
  ensureGroups();
  return state.groups.find(g=>g.id===state.currentGroupId) || null;
}
function groupOf(c){
  ensureGroups();
  return state.groups.find(g=>g.memberIds.includes(c.id)) || null;
}
function groupMembers(g){
  if(!g) return [];
  return g.memberIds.map(id=>state.players.find(p=>p.id===id)).filter(isConscious);
}
function splitIntoNewGroup(memberIds){
  ensureGroups();
  // chi si stacca da un gruppo che aveva già saltato in questo turno sincronizzato eredita
  // lo stesso stato: dividersi dopo il salto non deve regalare un salto extra fuori sincrono.
  const wasJumped = state.groups.some(g=>state.jumpedThisRound[g.id] && g.memberIds.some(id=>memberIds.includes(id)));
  state.groups.forEach(g=>{ g.memberIds = g.memberIds.filter(id=>!memberIds.includes(id)); });
  state.groups = state.groups.filter(g=>g.memberIds.length>0);
  const newG = { id:'g'+Math.random().toString(36).slice(2,9), memberIds: memberIds.slice() };
  state.groups.push(newG);
  if(wasJumped) state.jumpedThisRound[newG.id]=true;
  return newG;
}
function maybeResetJumpRound(){
  ensureGroups();
  const groups = state.groups.filter(g=>g.memberIds.length>0);
  // quando tutti i gruppi attualmente separati hanno saltato, il turno sincronizzato
  // ricomincia: nessuno resta bloccato in attesa per sempre.
  if(groups.length>0 && groups.every(g=>state.jumpedThisRound[g.id])) state.jumpedThisRound = {};
}
function mergeGroups(idA, idB){
  ensureGroups();
  const a = state.groups.find(g=>g.id===idA), b = state.groups.find(g=>g.id===idB);
  if(!a||!b||a===b) return;
  a.memberIds = a.memberIds.concat(b.memberIds);
  state.groups = state.groups.filter(g=>g!==b);
  if(state.currentGroupId===b.id) state.currentGroupId=a.id;
}
function mergeAllGroups(){
  ensureGroups();
  if(state.groups.length<=1) return;
  const survivor = state.groups[0];
  for(let i=1;i<state.groups.length;i++) survivor.memberIds = survivor.memberIds.concat(state.groups[i].memberIds);
  state.groups = [survivor];
  state.currentGroupId = survivor.id;
}
function largestOtherGroup(g){
  ensureGroups();
  return state.groups.filter(x=>x!==g).sort((a,b)=>groupMembers(b).length-groupMembers(a).length)[0] || null;
}
function activeChars(){ return groupMembers(currentGroup()); }
function healableChars(){
  // a differenza di activeChars() (chi PUÒ agire questo turno), include anche chi è svenuto
  // a 0 PV: uno svenuto non agisce da solo, ma resta un bersaglio valido per cure altrui.
  const g = currentGroup();
  if(!g) return [];
  return g.memberIds.map(id=>state.players.find(p=>p.id===id)).filter(c=>c && (c.status==='active'||c.status==='undead'||c.status==='unconscious'));
}

function applyPlaneIntrinsic(plane){
  const acts = activeChars();
  const ctx = {family: plane.family, type: plane.type || FAMILIES[plane.family]?.type, planeId: plane.id};
  if(state.currentDraw.sferaSuppressed){
    // Sfera Antiplanare: annulla del tutto l'effetto d'ingresso, incluse le scelte
    // obbligatorie di Vuoto/Specchi — si pesca comunque il normale Incontro del turno.
    logMsg(`🔮 Sfera Antiplanare: l'effetto intrinseco di ${plane.name} viene completamente annullato per il gruppo.`,'good');
  } else if(plane.id==='vuoto' && acts.length){
    state.currentDraw.phase = 'vuoto-choice';
    state.currentDraw.vuotoChoices = {};
    logMsg("🕳️ Il Vuoto costringe ogni presente a scegliere cosa perdere: 1 PV, un oggetto, uno spell o un'abilità. Non è facoltativo.",'warn');
    render();
    return;
  } else if(plane.id==='specchi' && acts.length){
    state.currentDraw.phase = 'specchi-choice';
    state.currentDraw.specchiChoices = {};
    logMsg("🪞 Il proprio riflesso sfida ognuno in una Contesa: si sceglie su quale caratteristica giocarla, prima di affrontare l'Incontro del turno.",'warn');
    render();
    return;
  } else if(plane.id==='aria' && acts.length){
    // Chi viene sbalzato via affronta subito un Incontro extra da solo; SOLO dopo che
    // quello è stato risolto per intero (finishIncontro, non qui) il gruppo riunito ne
    // affronta un secondo — prima i due pescavano entrambi qui, nello stesso istante:
    // il secondo sovrascriveva il primo prima ancora che il giocatore potesse vederlo.
    const scattered=[];
    acts.forEach(c=>{
      const r=checkRoll(c,'des');
      logMsg(`💨 ${c.name} check Destrezza: ${r.roll} vs ${r.val} → ${r.success?'ok':'sbalzato via'}.`);
      if(!r.success) scattered.push(c);
    });
    if(scattered.length){
      logMsg(`💨 ${scattered.map(c=>c.name).join(', ')} affronta un Incontro extra da solo; poi tutto il gruppo riunito ne affronta un secondo.`);
      drawIncontroForPlane(plane, null, scattered);
      if(state.currentDraw) state.currentDraw.pendingReunionPlaneId = plane.id;
      return;
    }
    // nessuno sbalzato via: un solo Incontro per tutti, come da flusso normale sotto.
  } else {
    const fn = PLANE_EFFECTS[plane.effectKey];
    if(fn) fn(plane, acts, ctx);
    else if(plane.family==='nonmorti' && plane.girone>=2) logMsg(`🧠 ${plane.name}: la mente comincia subito a logorarsi, si rischia la Follia a fine turno.`,'warn');
    else logMsg(`(Nessun effetto d'ingresso automatico per ${plane.name} — applica manualmente se necessario.)`);
  }
  if(RECUPERO_PLANES.has(plane.id) && acts.length){
    logMsg(`🛌 ${plane.name} è un piano di Recupero: il gruppo presente riposa automaticamente.`,'good');
    acts.forEach(c=>recuperoFor(c));
  }
  // Sogno: chi fallisce il check di Intelletto resta intrappolato nell'illusione e non
  // partecipa all'Incontro di questo turno — né scontro né altro, viene tolto dai target
  // prima ancora di pescare la carta (non solo escluso dal combattimento come la Furtività).
  let drawTargets = null;
  const dreaming = plane.id==='sogno' ? (state.currentDraw.dreamers || []) : [];
  const turnSkippers = acts.filter(c=>c.skipNextIncontro);
  if(dreaming.length || turnSkippers.length){
    drawTargets = acts.filter(c=>!dreaming.includes(c.id) && !c.skipNextIncontro);
  }
  if(turnSkippers.length){
    const names = turnSkippers.map(c=>c.name);
    const plural = names.length>1;
    logMsg(`⏳ ${names.join(', ')} ${plural?'restano':'resta'} esclus${plural?'i':'o'} dall'Incontro di questo turno: ${plural?'avevano':'aveva'} perso il turno precedente.`,'warn');
    turnSkippers.forEach(c=>{ c.skipNextIncontro=false; });
  }
  // draw incontro after intrinsic (unless plane fully occupies the turn, none do per rules: "si pesca comunque, come sempre")
  const forcedFamily = (plane.family==='demoniaco'||plane.family==='nonmorti') ? plane.deck : null;
  drawIncontroForPlane(plane, forcedFamily, drawTargets);
}
function annihilateUndead(acts, planeName){
  acts.forEach(c=>{
    if(c.status==='undead'){
      c.status='dead';
      logMsg(`☀️ ${c.name}, ormai non-morto, viene annientato da ${planeName} senza possibilità di salvezza.`,'bad');
    }
  });
}
const PLANE_EFFECTS = {
  fuoco:(p,acts,ctx)=>{ acts.forEach(c=>applyDamage(c,'pv',1,ctx)); logMsg('🔥 Danno d\'ingresso a tutti (+1 PV danno per ogni turno di permanenza, da applicare manualmente se si resta).'); },
  veleno:(p,acts,ctx)=>{ logMsg('☠️ Veleno nell\'aria: se il gruppo non riesce a evitare del tutto l\'Incontro (scappando dallo scontro o restando nascosto), subirà danno a fine turno.'); },
  acqua:(p,acts,ctx)=>{
    if(acts.length===0) return;
    const best = Math.max(...acts.map(c=>effectiveStat(c,'for')));
    const r=d6(); const success = r<=best||r===6;
    logMsg(`🌊 Check di gruppo (Forza, valore più alto ${best}): tiro ${r} → ${success?'superato':'FALLITO'}.`);
    if(!success){
      const minFor = Math.min(...acts.map(c=>effectiveStat(c,'for')));
      const victims = acts.filter(c=>effectiveStat(c,'for')===minFor);
      const victim = victims[Math.floor(Math.random()*victims.length)];
      logMsg(`🌊 ${victim.name} (Forza più bassa) viene trascinato via da solo in un portale casuale.`,'warn');
    }

  },
  terra:(p,acts,ctx)=>{
    acts.forEach(c=>{ const r=checkRoll(c,'for'); logMsg(`⛰️ ${c.name} check impatto Forza: ${r.roll} vs ${r.val} → ${r.success?'nessun danno':'DANNO'}.`); if(!r.success) applyDamage(c,'pv',1,ctx); });
    logMsg('⛰️ Ora si scava: massimo 3 turni per uscire o il gruppo muore travolto. Gestisci i tentativi di scavo dal pannello Gestisci di ciascun personaggio (check di Forza, +1 con attrezzi).');
  },
  tempesta:(p,acts,ctx)=>{ logMsg('⚡ Fulmini nell\'aria: se il gruppo non riesce a evitare del tutto l\'Incontro (scappando dallo scontro o restando nascosto), un fulmine colpirà qualcuno a fine turno.'); },
  cristallo:(p,acts,ctx)=>{ logMsg('💎 Incantesimi e danni fisici raddoppiati (+100%) qui: tienine conto quando applichi danni o spell.'); },
  luce:(p,acts,ctx)=>{ acts.forEach(c=>{ const r=checkRoll(c,'int'); logMsg(`☀️ ${c.name} check Intelletto: ${r.roll} vs ${r.val} → ${r.success?'superato':'FALLITO'}.`); if(!r.success){ ['for','des','int'].forEach(s=>applyPlaneDebuff(c,s)); logMsg(`☀️ ${c.name}: -1 For/Des/Int per tutta la permanenza nel piano.`);} }); },
  tenebre:(p,acts,ctx)=>{ acts.forEach(c=>{ ['for','des','int'].forEach(s=>applyPlaneDebuff(c,s)); }); logMsg('🌑 Buio automatico: -1 For/Des/Int per tutti, per tutta la permanenza nel piano.'); },
  sogno:(p,acts,ctx)=>{
    const dreaming=[];
    acts.forEach(c=>{
      const r=checkRoll(c,'int');

      if(!r.success) dreaming.push(c.id);
    });
    state.currentDraw.dreamers = dreaming;
    if(dreaming.length){
      const names = dreaming.map(id=>state.players.find(x=>x.id===id)?.name).filter(Boolean);
      const plural = names.length>1;
      logMsg(`💭 ${names.join(', ')} ${plural?'restano':'resta'} intrappolat${plural?'i':'o'} nell'illusione: non partecipa${plural?'no':''} all'Incontro di questo turno, sia esso uno scontro o altro.`,'warn');
    }
  },
  ordine:(p,acts,ctx)=>{

  },
  legge:(p,acts,ctx)=>{ logMsg('⚖️ Ogni oggetto preso qui richiede un pegno in cambio (baratto forzato, applica manualmente).'); },
  sacro:(p,acts,ctx)=>{ annihilateUndead(acts,'Sacro'); logMsg('✨ Piano protetto: non-morti/demoni subiscono danno passivo; qui il Recupero cura anche 1 San in più.'); },
  stasi:(p,acts,ctx)=>{ logMsg('⏳ Qui nulla può cambiare: cure, potenziamenti e danni non hanno effetto. Mazzo Piani non manipolabile.'); },
  sole:(p,acts,ctx)=>{ annihilateUndead(acts,'Sole'); acts.forEach(c=>{ if(c.status==='undead') return; if(c.stats.anima<c.start.anima){ const r=checkRoll(c,'anima'); if(!r.success){ applyTempDebuff(c,STATS[Math.floor(Math.random()*6)]); logMsg(`☀️ ${c.name} porta Corruzione e fallisce il check extra di Anima: depotenziamento casuale.`);} } }); },
  metallo:(p,acts,ctx)=>{ acts.forEach(c=>{ const r=checkRoll(c,'des'); logMsg(`⚙️ ${c.name} check Destrezza: ${r.roll} vs ${r.val} → ${r.success?'libero':'incastrato'}.`); if(!r.success){ applyDamage(c,'pv',1,ctx); logMsg(`⚙️ ${c.name} resta incastrato: perde il turno e 1 danno.`);} }); },

  putrefazione:(p,acts,ctx)=>{ acts.forEach(c=>{ const r=d6(); const stat = r<=3?'for':'des'; applyTempDebuff(c,stat); }); },
  tempo:(p,acts,ctx)=>{ acts.forEach(c=>{ const r=checkRoll(c,'int'); logMsg(`⏳ ${c.name} check Intelletto: ${r.roll} vs ${r.val} → ${r.success?'superato':'FALLITO'}.`); if(!r.success){ const stat=STATS[Math.floor(Math.random()*6)]; applyTempDebuff(c,stat); } }); },
  cenere:(p,acts,ctx)=>{ acts.forEach(c=>{ const r=checkRoll(c,'for'); logMsg(`💨 ${c.name} check Forza: ${r.roll} vs ${r.val} → ${r.success?'superato':'FALLITO'}.`); if(!r.success){ const idx=pickLosableItemIndex(c); if(idx>=0){ const lost=c.inventory.splice(idx,1)[0]; logMsg(`💨 ${c.name} perde ${OGGETTI_BY_ID[lost]?.name} (Cenere).`); } else if(c.protectedItemId && c.inventory.length){ logMsg(`⏳ ${c.name}: il tempo fermo protegge l'unico oggetto rimasto dalla Cenere.`); } } }); },
  oblio:(p,acts,ctx)=>{ acts.forEach(c=>{ const r=checkRoll(c,'int'); logMsg(`🌫️ ${c.name} check Intelletto: ${r.roll} vs ${r.val} → ${r.success?'superato':'FALLITO'}.`); if(!r.success){ if(c.spells.length){ logMsg(`🌫️ ${c.name} dimentica temporaneamente uno spell (rimane in mano ma non utilizzabile fino a Recupero — gestione manuale).`);} else applyTempDebuff(c,'int'); } }); },
  ombra:(p,acts,ctx)=>{ acts.forEach(c=>{ resolveAutoCombat([c],[{name:'La tua Ombra (Ombra)', statKey:'des', value:2}], ctx); }); },
  none:()=>{},
};
function resolveAttack(c, stat){
  if(c.dardoReady && ['for','int','des'].includes(stat)){
    c.dardoReady=false;
    return {roll:null, hit:true, dmg:2, dardo:true};
  }
  const r=checkRoll(c,stat);
  const isCrit = r.roll===6;
  const hit = r.roll<=r.val || isCrit;
  let dmg=0;
  if(hit){
    const cls=CLASSES[c.cls];
    dmg = (cls.special==='furia' && (stat==='for'||isCrit)) ? 2 : (1+damageBonusFor(c,stat));
    if(c.dmgBonusPlane) dmg += c.dmgBonusPlane; // Benedizione: +2 danno per tutta la permanenza nel piano
  }
  return {roll:r.roll, hit, dmg};
}
function grantCompanion(c, name, value){
  // solo un compagno alla volta: l'ultimo sostituisce il primo, senza recuperare i punti persi del vecchio
  if(c.companion) logMsg(`🗿 ${c.companion.name} di ${c.name} viene sostituito da ${name}.`,'warn');
  c.companion = {name, value};
  logMsg(`🗿 ${c.name} lega a sé ${name} (valore ${value}).`,'good');
}
function setProtectedItem(c, itemId){
  // Statua di Stasi: un solo oggetto alla volta, il tempo si ferma per lui —
  // non può più essere perso, rubato o distrutto da nessun effetto, per il resto della partita.
  const prev = c.protectedItemId;
  c.protectedItemId = itemId;
  const name = OGGETTI_BY_ID[itemId]?.name || itemId;
  if(prev && prev!==itemId){
    logMsg(`⏳ ${c.name}: la protezione della Statua passa a ${name} (${OGGETTI_BY_ID[prev]?.name||prev} torna vulnerabile).`,'warn');
  } else {
    logMsg(`⏳ ${c.name}: il tempo si ferma per ${name}. Non potrà più essere perso, rubato o distrutto.`,'good');
  }
}
function allOwnedItemIds(c){
  // tutti gli oggetti posseduti: inventario + equipaggiati — la Statua di Stasi può
  // proteggere qualsiasi oggetto, non solo quelli ancora liberi nello zaino.
  const ids = [...c.inventory];
  if(c.equipped.weapon) ids.push(c.equipped.weapon);
  if(c.equipped.armor) ids.push(c.equipped.armor);
  if(c.equipped.shield) ids.push(c.equipped.shield);
  ids.push(...c.equipped.rings);
  return ids;
}
function pickLosableItemIndex(c){
  // esclude l'oggetto protetto dalla Statua di Stasi da qualsiasi perdita casuale/manuale
  const idxs = [];
  c.inventory.forEach((id,i)=>{ if(id!==c.protectedItemId) idxs.push(i); });
  if(!idxs.length) return -1;
  return idxs[Math.floor(Math.random()*idxs.length)];
}
function applyCombatPassthrough(c, statKey, ctx){
  // il compagno protegge il personaggio durante uno scontro (come fosse in Furtività):
  // il danno passante lo assorbe lui, permanentemente, finché non si distrugge.
  if(c.companion){
    c.companion.value -= 1;
    if(c.companion.value<=0){
      logMsg(`🗿 ${c.companion.name} di ${c.name} si distrugge assorbendo il colpo.`,'bad');
      c.companion = null;
    } else {
      logMsg(`🗿 ${c.companion.name} protegge ${c.name} dal colpo (${c.companion.value} rimasti).`);
    }
    return;
  }
  applyDamage(c, statKey, 1, ctx);
}
function passthroughTargets(acts){
  // Arco Lungo Planare: chi lo impugna e supera un check di Destrezza combatte a distanza
  // restando nascosto, quindi non subisce il danno passante del team in quel giro.
  const eligible = acts.filter(c=>{
    const w = c.equipped.weapon && OGGETTI_BY_ID[c.equipped.weapon];
    if(!w || !w.rangedStealth) return true;
    const r = checkRoll(c,'des');
    if(r.success){ logMsg(`🏹 ${c.name} (${w.name}) combatte a distanza restando nascosto: non subisce danno passante in questo giro.`); return false; }
    return true;
  });
  return eligible.length ? eligible : acts;
}
function resolveAutoCombat(acts, entityDefs, ctx){
  if(!acts || acts.length===0) return; // nessuno presente/cosciente: niente da risolvere
  // Combattimento one-shot risolto automaticamente giro dopo giro (usato per effetti intrinseci di piano, es. Ombra),
  // senza passare dall'interfaccia interattiva del normale Incontro del turno.
  const entities = entityDefs.map(e=>({...e, hp: e.hp!==undefined?e.hp:e.value}));
  let rounds=0;
  while(entities.some(e=>e.hp>0) && rounds<10){
    rounds++;
    let teamDmg=0, entityDmg=0;
    acts.forEach(c=>{
      const stat = entities[0].statKey;
      const a=resolveAttack(c,stat);
      teamDmg+=a.dmg;
    });
    entities.forEach(e=>{ if(e.hp<=0) return; const r=d6(); if(r<=e.value) entityDmg+=e.value; });
    let remaining=teamDmg;
    entities.forEach(e=>{ if(remaining<=0||e.hp<=0) return; const take=Math.min(remaining,e.hp); e.hp-=take; remaining-=take; });
    const passThrough=Math.max(0, entityDmg-teamDmg);
    if(passThrough>0){ let idx=0; for(let i=0;i<passThrough;i++){ applyCombatPassthrough(acts[idx%acts.length],'pv',{...ctx, combat:true}); idx++; } }
  }
  logMsg(`⚔️ ${acts.map(c=>c.name).join(', ')} risolve un combattimento automatico contro ${entityDefs[0].name} in ${rounds} giro/i.`);
}
function reshuffleMazzoPiani(){
  if(inStasi()){ logMsg('⏳ Qui nulla può cambiare: il mazzo Piani non è manipolabile (Stasi).', 'warn'); return; }
  state.mazzoPiani = shuffle(state.mazzoPiani);
  logMsg('🔀 Il mazzo Piani viene rimescolato per intero.');
}

/* -------- Demoniaco / Non-morti girone effects (Corruzione / Follia) -------- */
function applyGironeEffects(plane, acts){
  if(plane.family==='demoniaco' && plane.girone>=2){
    acts.forEach(c=>{ applyAnimaLoss(c,1); });
  }
  // Piano Negativo (nonmorti) dal 2° turno consecutivo: la perdita di Sanità è a fine
  // turno, non all'ingresso — vedi applyFineTurnoIfNeeded(). Lì si passa direttamente da
  // applySanLoss (che gestisce da sé il check contro la Follia, stesse regole di Corruzione/
  // Veleno/Tempesta), invece di un check ridondante qui che ne raddoppiava uno interno.
}
function applyAnimaLoss(c,n){
  for(let i=0;i<n;i++){
    applyDamage(c,'anima',1,{ignoreResistance:true});
    triggerCorruzione(c);
  }
}
function applySanLoss(c,n){
  for(let i=0;i<n;i++){
    applyDamage(c,'san',1,{ignoreResistance:true});
    triggerFollia(c);
  }
}
function triggerFollia(c){
  const check = checkRoll(c,'san');
  logMsg(`🎲 ${c.name}: check di Sanità contro la Follia: ${check.roll} vs ${check.val} → ${check.success?'superato, nessun effetto':'FALLITO'}.`, check.success?'good':'warn');
  if(check.success) return;
  const r=d6();
  // tabella di gravità: 6 è sempre il miglior risultato possibile, come ovunque nel gioco.
  if(r>=5){ logMsg(`🎲 Tiro di Follia per ${c.name} (${r}): nulla, nonostante il campanello d'allarme.`, 'warn'); return; }
  if(r>=3){ c.pendingFollia='salto'; logMsg(`🎲 Tiro di Follia per ${c.name} (${r}): al prossimo turno si lancerà da solo in un portale casuale.`, 'warn'); return; }
  c.pendingFollia='trascina';
  logMsg(`🎲 Tiro di Follia per ${c.name} (${r}): al prossimo turno tenterà di trascinare con sé un compagno (Contesa di Forza).`, 'warn');
}
function triggerCorruzione(c){
  const check = checkRoll(c,'anima');
  logMsg(`🎲 ${c.name}: check di Anima contro la Corruzione: ${check.roll} vs ${check.val} → ${check.success?'superato, nessun effetto':'FALLITO'}.`, check.success?'good':'warn');
  if(check.success) return;
  const r=d6();
  // tabella di gravità: 6 è sempre il miglior risultato possibile, come ovunque nel gioco.
  if(r>=5){ logMsg(`🎲 Tiro di Corruzione per ${c.name} (${r}): nulla, nonostante il campanello d'allarme.`, 'warn'); return; }
  if(r>=3){ c.pendingCorruzione='contrario'; logMsg(`🎲 Tiro di Corruzione per ${c.name} (${r}): al prossimo turno farà il contrario del resto del gruppo.`, 'warn'); return; }
  if(c.sigilloActive){ logMsg(`🎲 Tiro di Corruzione per ${c.name} (${r}): agirebbe contro il team, ma il Sigillo lo impedisce.`, 'good'); return; }
  c.pendingCorruzione='ostile';
  logMsg(`🎲 Tiro di Corruzione per ${c.name} (${r}): al prossimo turno agirà contro il team.`, 'warn');
}
/* -------- risoluzione delle azioni dovute a Follia/Corruzione al turno successivo -------- */
function resolveForceContest(a,b){
  for(let i=0;i<20;i++){
    const ra=checkRoll(a,'for'), rb=checkRoll(b,'for');
    if(ra.success && !rb.success) return a;
    if(rb.success && !ra.success) return b;
    // entrambi riescono o entrambi falliscono: si ritira (nessun vincitore ancora)
  }
  return a;
}
function soloForcedJump(group, reason){
  group.forEach(c=>{ revertFormaSelvatica(c); revertMirrorBoost(c); revertPlaneDebuffs(c); revertPerPlaneBuffs(c); });
  const newG = splitIntoNewGroup(group.map(c=>c.id)); // la separazione forzata è persistente, non solo un turno isolato
  state.jumpedThisRound[newG.id] = true; // questo salto forzato conta come il salto di questo turno per il nuovo gruppo
  maybeResetJumpRound();
  if(state.mazzoPiani.length===0) state.mazzoPiani = freshDeckPiani();
  const drawnId = state.mazzoPiani.shift();
  const names = group.map(x=>x.name).join(' e ');
  if(drawnId==='__PT__'){
    reinsertPianoCard('__PT__');
    logMsg(`🌀 Salto forzato da ${reason}: ${names} pesca un segnaposto Piano Terreno — nessun effetto speciale, si tratta come una carta normale.`, 'warn');
    return;
  }
  const plane = PIANI_BY_ID[drawnId];
  reinsertPianoCard(drawnId);
  logMsg(`🌀 Salto forzato da ${reason}: ${names} ${group.length>1?'finiscono':'finisce'} da ${group.length>1?'soli':'solo'} in <strong>${plane.name}</strong> (destinazione totalmente casuale, senza le informazioni del gruppo unito).`, 'warn');
  group.forEach(x=>resetResistanceForPlane(x, plane.family));
  const ctx = {family: plane.family, type: plane.type || FAMILIES[plane.family]?.type, planeId: plane.id};
  const fn = PLANE_EFFECTS[plane.effectKey];
  if(fn) fn(plane, group, ctx);
  logMsg(`(${names} ${group.length>1?'formano':'forma'} ora un gruppo separato: da qui in poi ${group.length>1?'salteranno':'salterà'} per conto proprio. Applicato solo l'effetto intrinseco del piano di questo primo salto forzato — l'eventuale Incontro va gestito manualmente dal tavolo.)`);
}
function applyPendingMadnessActions(){
  activeChars().forEach(c=>{
    if(c.pendingFollia){
      const action = c.pendingFollia; c.pendingFollia=null;
      if(action==='salto'){ soloForcedJump([c], 'Follia'); }
      else {
        const others = activeChars().filter(x=>x.id!==c.id);
        if(others.length===0){ soloForcedJump([c], 'Follia'); }
        else {
          const target = others[Math.floor(Math.random()*others.length)];
          const winner = resolveForceContest(c, target);
          if(winner===c){ logMsg(`🌀 ${c.name} (Follia) trascina con sé ${target.name}, afferrandolo per la manina a forza: Contesa di Forza vinta.`, 'warn'); soloForcedJump([c,target], 'Follia'); }
          else { logMsg(`🌀 ${target.name} resiste alla presa di ${c.name} (Follia): solo ${c.name} si lancia comunque da solo.`, 'warn'); soloForcedJump([c], 'Follia'); }
        }
      }
    }
    if(c.pendingCorruzione){
      const action = c.pendingCorruzione; c.pendingCorruzione=null;
      if(action==='contrario') logMsg(`👹 ${c.name} (Corruzione): in questo turno fa esattamente il contrario di quello che fa il resto del gruppo — il tavolo interpreta l'azione.`, 'warn');
      else {
        // agire ostile reale: attacca il compagno più debole di lui nella sua caratteristica
        // migliore, un solo giro di scontro (non il ciclo di combattimento completo).
        const topStat = ['for','int','des'].reduce((best,s)=>effectiveStat(c,s)>effectiveStat(c,best)?s:best,'for');
        const others = activeChars().filter(x=>x.id!==c.id);
        const targets = others.filter(x=>effectiveStat(x,topStat)<effectiveStat(c,topStat));
        if(targets.length===0){
          logMsg(`👹 ${c.name} (Corruzione): agisce contro il team, ma nessun compagno è più debole di lui in ${STAT_LABEL[topStat]} — l'aggressione non trova bersaglio.`, 'warn');
        } else {
          const target = targets[Math.floor(Math.random()*targets.length)];
          const r = checkRoll(c, topStat);
          logMsg(`👹 ${c.name} (Corruzione) attacca ${target.name} su ${STAT_LABEL[topStat]}: ${r.roll} vs ${r.val} → ${r.success?'colpito':'mancato'}.`, 'warn');
          if(r.success) applyDamage(target,'pv',1,{ignoreResistance:true});
        }
      }
    }
  });
}

/* -------- Incontro drawing / d6 generic crossover -------- */
function drawIncontroForPlane(plane, forcedDeck, targetChars){
  const acts = targetChars || activeChars();
  if(acts.length===0){ render(); return; }
  applyGironeEffects(plane, acts);
  let deckKey = forcedDeck || plane.deck || 'generico';
  // "uguale per tutti i piani, senza eccezioni" — vale anche in Demoniaco e Piano Negativo (girone forzato).
  const roll = d6();
  if(roll===6 && deckKey!=='generico'){ logMsg('🎲 d6 = 6 → si pesca dal sotto-mazzo Generico invece che da quello tematico.'); deckKey='generico'; }
  const deck = state.subdecks[deckKey];
  if(deck.length===0){
    state.subdecks[deckKey] = shuffle(state.subdecksDiscard[deckKey]);
    state.subdecksDiscard[deckKey]=[];
  }
  const cardId = state.subdecks[deckKey].shift();
  state.subdecksDiscard[deckKey].push(cardId);
  const card = INCONTRI[deckKey].find(c=>c.id===cardId);
  state.currentDraw = { planeId: plane.id, incontroDeck:deckKey, incontroId: cardId, phase:'incontro', targets: acts.map(c=>c.id), stealthDecided:{}, hidden:[], manualUsed:{} };
  logMsg(`🎴 Incontro (${FAMILIES[deckKey]?.name||deckKey}): <strong>${card.name}</strong>.`);
  render();
}
