function inStasi(){ const p=currentPlane(); return !!p && p.id==='stasi'; }
function currentIncontro(){ if(!state.currentDraw||!state.currentDraw.incontroId) return null; return INCONTRI[state.currentDraw.incontroDeck].find(c=>c.id===state.currentDraw.incontroId); }

function renderIncontroAction(){
  const el = document.getElementById('incontroAction');
  if(!el || !state.currentDraw) return;
  const plane = currentPlane(); const card = currentIncontro();
  const acts = state.currentDraw.targets.map(id=>state.players.find(p=>p.id===id)).filter(c=>c && (c.status==='active'||c.status==='undead'));
  // Qualsiasi azione che non sia un semplice check (un'interazione: commerciare, aprire
  // qualcosa, raccogliere un oggetto...) fa scattare l'effetto di fine turno del piano, se
  // presente — a differenza di uno scontro (dove si può ancora tentare la fuga) qui non c'è
  // modo di evitarlo una volta scelto di agire, quindi lo si avvisa prima.
  const fineTurnoWarning = (hasFineTurnoRisk(plane) && card.type!=='nessun' && !card.safeRespite)
    ? `<p class="hint">⚠️ Agire qui farà scattare l'effetto di fine turno di ${escapeHtml(plane.name)}.</p>` : '';
  if(card.type==='nessun'){
    el.innerHTML = `<button class="primary" id="btnResolveDone">Continua</button>`;
    document.getElementById('btnResolveDone').onclick=finishIncontro;
    return;
  }
  if(card.manual){
    el.innerHTML = fineTurnoWarning + renderManualPanel(card, acts);
    bindManualPanel(card, acts);
    return;
  }
  if(card.pattoSangueCard){
    el.innerHTML = fineTurnoWarning + renderPattoSangueCard(acts);
    bindPattoSangueCard(acts);
    return;
  }
  if(card.bivioCard){
    el.innerHTML = fineTurnoWarning + renderBivioCard();
    bindBivioCard();
    return;
  }
  if(card.oblioCard){
    el.innerHTML = fineTurnoWarning + renderOblioCard(acts);
    bindOblioCard(acts);
    return;
  }
  if(card.statuaCard){
    el.innerHTML = fineTurnoWarning + renderStatuaCard(acts);
    bindStatuaCard(acts);
    return;
  }
  if(card.esattoreCard){
    el.innerHTML = fineTurnoWarning + renderEsattoreCard(acts);
    bindEsattoreCard(acts, plane);
    return;
  }
  if(card.richiamoCard){
    if(!state.currentDraw.autoApplied){
      const victims = acts.filter(c=>c.turnStartPv!=null && c.stats.pv < c.turnStartPv);
      victims.forEach(c=>{ applyDamage(c,'pv',1,{family:plane.family, planeId:plane.id}); logMsg(`🩸 ${c.name} aveva già perso PV in questo turno: il Richiamo di sangue lo colpisce di nuovo (-1 PV).`,'warn'); });
      if(!victims.length) logMsg('🩸 Nessuno ha ancora perso PV in questo turno: il Richiamo di sangue non ha effetto.');
      state.currentDraw.autoApplied = true;
    }
    el.innerHTML = `<button class="primary" id="btnResolveDone">Continua</button>`;
    document.getElementById('btnResolveDone').onclick=finishIncontro;
    return;
  }
  if(card.anomaliaCard){
    if(!state.currentDraw.autoApplied){
      state.currentDraw.autoApplied = true;
      const r = d6();
      if(r<=2){
        logMsg(`⏳ Anomalia temporale (${r}): il tempo rallenta, il gruppo perde questo turno e resta fermo dov'è.`,'warn');
        if(hasFineTurnoRisk(plane)){
          logMsg(`⏳ Restando fermo, il gruppo subisce di nuovo il rischio di fine turno di ${plane.name}.`,'warn');
          applyFineTurnoIfNeeded();
        }
      } else if(r<=4){
        logMsg(`⏳ Anomalia temporale (${r}): un breve sussulto, poi tutto torna normale. Nessun effetto.`);
      } else if(r===5){
        logMsg(`⏳ Anomalia temporale (${r}): il tempo accelera, si pesca subito un altro Incontro.`,'warn');
        drawIncontroForPlane(plane, null, acts);
        return;
      } else {
        acts.forEach(c=>c.resources++);
        logMsg(`⏳ Anomalia temporale (${r}): un dejà-vu favorevole, +1 risorsa planare a testa.`,'good');
      }
    }
    el.innerHTML = `<button class="primary" id="btnResolveDone">Continua</button>`;
    document.getElementById('btnResolveDone').onclick=finishIncontro;
    return;
  }
  if(card.type==='incontro'){
    const stealthAllowed = plane.family!=='demoniaco' && plane.family!=='nonmorti';
    const decided = state.currentDraw.stealthDecided||{};
    // la Furtività ha senso solo se, restando nascosto, l'entità ha qualcun altro su cui
    // concentrarsi al posto tuo: un altro PG presente, oppure un compagno che si metta
    // davanti. Da soli senza compagno non c'è nessun bersaglio alternativo, niente da tentare.
    const stealthCapable = stealthAllowed ? acts.filter(c=>CLASSES[c.cls].stealth && !decided[c.id]) : [];
    const stealthEligible = stealthCapable.filter(c=>acts.length>1 || c.companion);
    const stealthBlocked = stealthCapable.filter(c=>!(acts.length>1 || c.companion));
    if(stealthBlocked.length && !state.currentDraw.stealthBlockedLogged){
      state.currentDraw.stealthBlockedLogged = true;
      stealthBlocked.forEach(c=>logMsg(`🥷 ${c.name} è da solo, senza compagni né un compagno che si metta davanti: la Furtività non ha nessun altro bersaglio su cui far ricadere l'attenzione, niente da tentare.`));
    }
    if(stealthEligible.length){
      el.innerHTML = renderStealthPanel(stealthEligible);
      bindStealthPanel(stealthEligible);
      return;
    }
    const hidden = state.currentDraw.hidden||[];
    const fighters = acts.filter(c=>!hidden.includes(c.id));
    if(fighters.length===0){
      el.innerHTML = `<p class="hint">🥷 Tutti i presenti sono riusciti a restare nascosti: nessuno scontro, né rischi né ricompense.</p><button class="primary" id="btnResolveDone">Continua</button>`;
      document.getElementById('btnResolveDone').onclick=()=>{
        // nascosti dall'Incontro: si evitano anche gli effetti di fine turno del piano.
        state.currentDraw.skipFineTurno = true;
        finishIncontro();
      };
      return;
    }
    el.innerHTML = renderCombatPanel(plane, card, fighters);
    bindCombatPanel(plane, card, fighters);
    return;
  }
  if(card.type==='check'){
    if(card.groupCheck){
      const failHint = consequenceLabel(card.onFail, plane);
      el.innerHTML = (failHint?`<p class="hint">⚠️ Se il gruppo fallisce: ${failHint}.</p>`:'') + `<button class="primary" id="btnGroupCheck">Esegui check di gruppo (${STAT_LABEL[card.groupCheck]}, penalità ${card.penalty})</button><div id="checkResult"></div>`;
      document.getElementById('btnGroupCheck').onclick=()=>{
        const best = Math.max(...acts.map(c=>effectiveStat(c,card.groupCheck))) + card.penalty;
        const r=d6(); const success = r<=best || r===6;
        document.getElementById('checkResult').innerHTML = `<div class="roll-row"><div class="roll-chip ${success?'hit':'miss'}"><div class="roll-die">${r}</div> vs ${best} → ${success?'Successo':'Fallito'}</div></div><button class="primary mt1" id="btnCheckDone">Continua</button>`;
        if(!success && card.onFail){ applyConsequence(card.onFail, acts, plane); }
        document.getElementById('btnCheckDone').onclick=finishIncontro;
      };
      return;
    }
    if(card.auto){
      // automatic check-less effect — renderIncontroAction() viene rischedulata a ogni
      // render() (bindGame -> setTimeout), quindi senza questo guard l'effetto verrebbe
      // riapplicato a ogni interazione UI mentre il pannello resta a schermo, non solo una volta.
      if(card.onFail && !state.currentDraw.autoApplied){ applyConsequence(card.onFail, acts, plane); state.currentDraw.autoApplied = true; }
      el.innerHTML = `<button class="primary" id="btnResolveDone">Continua</button>`;
      document.getElementById('btnResolveDone').onclick=finishIncontro;
      return;
    }
    const checkStat = card.check==='native' ? nativeStatFor(plane) : card.check;
    const failHint = consequenceLabel(card.onFail, plane);
    const successHint = card.onSuccess?.type==='item' ? 'trovi un oggetto' : null;
    el.innerHTML = (successHint?`<p class="hint">✨ Se superi: ${successHint}.</p>`:'') + (failHint?`<p class="hint">⚠️ Se fallisci: ${failHint}.</p>`:'') + acts.map(c=>`<div class="row" style="margin-bottom:.4rem;"><span style="min-width:140px;">${c.name}</span><button class="small" data-checkchar="${c.id}">Check ${STAT_LABEL[checkStat]} (${effectiveStat(c,checkStat)})</button><span id="res_${c.id}"></span></div>`).join('') + `<button class="primary mt1" id="btnResolveDone" disabled>Continua</button>`;
    let done=0;
    const splitFailed = [];
    el.querySelectorAll('[data-checkchar]').forEach(b=>{
      b.onclick=()=>{
        const c = acts.find(x=>x.id===b.dataset.checkchar);
        const r=checkRoll(c,checkStat);
        document.getElementById('res_'+c.id).innerHTML = `<span class="roll-chip ${r.success?'hit':'miss'}"><span class="roll-die">${r.roll}</span> ${r.success?'OK':'Fallito'}</span>`;
        b.disabled=true;
        if(!r.success && card.onFail?.type==='splitGroup'){ splitFailed.push(c.id); }
        else if(!r.success && card.onFail){ applyConsequence(card.onFail, [c], plane); }
        if(r.success && card.onSuccess?.type==='item'){ const it=drawOggetto(); if(it){ c.inventory.push(it); logMsg(`🎁 ${c.name} trova ${OGGETTI_BY_ID[it].name}.`,'good'); } }
        done++; if(done>=acts.length){ document.getElementById('btnResolveDone').disabled=false; }
      };
    });
    document.getElementById('btnResolveDone').onclick=()=>{
      // lo split va fatto qui, a risoluzione ultimata: farlo dentro il singolo click
      // toglierebbe personaggi dal gruppo mentre altri stanno ancora tirando il check.
      if(splitFailed.length){
        const newG = splitIntoNewGroup(splitFailed);
        const names = groupMembers(newG).map(x=>x.name).join(', ');
        logMsg(`🌀 ${names} non regge la frattura e finisce in un nuovo gruppo, separato dal resto.`,'warn');
      }
      finishIncontro();
    };
    return;
  }
  if(card.type==='ricompensa'){
    el.innerHTML = fineTurnoWarning + renderRewardPanel(card, acts);
    bindRewardPanel(card, acts);
    return;
  }
  el.innerHTML = `<button class="primary" id="btnResolveDone">Continua</button>`;
  document.getElementById('btnResolveDone').onclick=finishIncontro;
}

function consequenceLabel(cons, plane){
  // traduce onFail in una frase breve, mostrata PRIMA di tirare: altrimenti l'unico modo
  // di scoprire cosa succede fallendo un check è fallirlo e leggerlo nel diario a cose fatte.
  if(!cons) return null;
  switch(cons.type){
    case 'tempDebuff': {
      let stat=cons.stat;
      if(stat==='native') stat = plane ? nativeStatFor(plane) : null;
      if(stat==='random') return 'depotenziamento temporaneo a una caratteristica casuale';
      return stat ? `depotenziamento temporaneo a ${STAT_LABEL[stat]}` : 'depotenziamento temporaneo';
    }
    case 'damage': return `-${cons.n||1} PV`;
    case 'loseTurn': return 'perdita del turno';
    case 'loseItem': return 'perdita di un oggetto casuale';
    case 'animaLoss': return `-${cons.n||1} Anima (rischio Corruzione)`;
    case 'splitGroup': return 'separazione: finisci in un nuovo gruppo, staccato dal resto';
    case 'scatterSelf': return 'allontanamento temporaneo dal gruppo';
    case 'forgetSpell': return 'dimenticanza temporanea di uno spell (o depotenziamento a Intelletto se non ne hai)';
    case 'minor': return 'un piccolo effetto negativo, a discrezione del tavolo';
    default: return null;
  }
}
function onLoseExtraLabel(key){
  if(key==='loseTurn') return 'perdita del turno';
  if(key==='tempDebuffSan') return 'depotenziamento temporaneo a Sanità Mentale';
  if(key==='tempDebuffRandom') return 'depotenziamento temporaneo a una caratteristica casuale';
  return null;
}
function applyConsequence(cons, targets, plane){
  targets.forEach(c=>{
    switch(cons.type){
      case 'tempDebuff': {
        let stat=cons.stat; if(stat==='native') stat = nativeStatFor(plane); if(stat==='random') stat=STATS[Math.floor(Math.random()*6)];
        applyTempDebuff(c,stat); break;
      }
      case 'damage': applyDamage(c,'pv',cons.n,{family:plane.family, planeId:plane.id}); break;
      case 'loseTurn': c.skipNextIncontro=true; logMsg(`⏳ ${c.name} perde il turno: non parteciperà all'Incontro del prossimo piano.`,'warn'); break;
      case 'loseItem': { const idx=pickLosableItemIndex(c); if(idx>=0){ const lost=c.inventory.splice(idx,1)[0]; logMsg(`🎒 ${c.name} perde ${OGGETTI_BY_ID[lost]?.name}.`); } else if(c.protectedItemId && c.inventory.length){ logMsg(`⏳ ${c.name}: il tempo fermo protegge l'unico oggetto rimasto.`); } break; }
      case 'animaLoss': applyAnimaLoss(c,cons.n||1); break;
      case 'scatterSelf': logMsg(`🌀 ${c.name} si allontana dal gruppo, si riunirà al turno successivo.`,'warn'); break;
      case 'forgetSpell': if(c.spells.length) logMsg(`🌫️ ${c.name} dimentica temporaneamente uno spell (torna a Recupero).`); else applyTempDebuff(c,'int'); break;
      case 'minor': logMsg(`❓ ${c.name}: effetto minore casuale, risolvilo narrativamente.`); break;
      case 'ampSpells': {
        // Amplificazione: prima amplificava un beneficio/maleficio elementare GIA' attivo,
        // ma quasi sempre non c'era nulla da amplificare — un pescaggio a vuoto la maggior
        // parte delle volte. Ridisegnata: apre una finestra che potenzia ogni spell di danno
        // o cura lanciato mentre resta aperta (+1 all'effetto), finché il gruppo non salta via.
        if(!state.amplifySpellsActive){
          state.amplifySpellsActive = true;
          logMsg(`🔥 ${plane.name}: ogni spell di danno o cura lanciato qui ottiene +1 all'effetto, finché il gruppo non salta via.`,'good');
        }
        break;
      }
      case 'corrode': {
        // Corrosione lenta: sospende il bonus di un'arma o armatura equipaggiata con bonus,
        // fino al prossimo Recupero. Se equipaggia entrambe, sceglie il personaggio.
        const slots = ['weapon','armor'].filter(slot=>{
          const id=c.equipped[slot]; if(!id || (c.corroded && c.corroded[slot])) return false;
          const it=OGGETTI_BY_ID[id];
          return it && (it.statBonus||0)>0 && (it.statKey||it.statKey2||it.statKey3);
        });
        if(slots.length===0){ logMsg(`⚙️ ${c.name}: nessun'arma o armatura equipaggiata con bonus da corrodere, nessun effetto.`); }
        else if(slots.length===1){
          c.corroded[slots[0]]=true;
          logMsg(`⚙️ ${c.name}: ${OGGETTI_BY_ID[c.equipped[slots[0]]].name} perde temporaneamente il bonus (torna a Recupero).`,'warn');
        } else {
          openCorrosioneChoiceModal(c, slots);
        }
        break;
      }
    }
  });
}
function nativeStatFor(plane){
  if(plane.check==='random') return STATS[Math.floor(Math.random()*6)];
  if(plane.check==='for_or_int') return Math.random()<0.5?'for':'int';
  if(plane.check==='choice') return 'for';
  return plane.check||'for';
}

function dismissEncounterForGroup(sourceName){
  const card = currentIncontro();
  if(!state.currentDraw || state.currentDraw.phase!=='incontro' || !card || card.type!=='incontro'){

/* ---------- combat / contesa ---------- */
function gravityValue(gravitySpec, plane){
  if(gravitySpec==='level') return plane.girone||1;
  if(gravitySpec==='level+1') return (plane.girone||1)+1;
  if(gravitySpec==='level-1') return Math.max(1,(plane.girone||1)-1);
  return 2 + (gravitySpec||0);
}
function renderCombatPanel(plane, card, acts){
  if(!state.currentDraw.combat){
    let checkStat = card.check;
    if(checkStat==='native') checkStat = nativeStatFor(plane);
    if(checkStat==='choice') checkStat = null; // decided per-char
    if(checkStat==='random') checkStat = null; // decided per-roll
    let gravity = card.forceBase2 ? gravityValue(card.gravity,{girone:1}) : gravityValue(card.gravity, plane);
    let entities=[];
    if(card.swarm==='auto'){
      // "gravità -1 rispetto al girone corrente (mai sotto 1)": gravity è già il valore finale
      // per creatura (1 al 1°/2° girone, 2 al 3°) — 3 creature a valore 1, 2 a valore 2.
      const n = gravity<=1?3:2;
      for(let i=0;i<n;i++) entities.push({name:card.name+' #'+(i+1), statKey:checkStat||'for', value:gravity});
    } else if(card.swarm){
      for(let i=0;i<card.swarm;i++) entities.push({name:card.name+' #'+(i+1), statKey:checkStat||'for', value:gravity});
    } else {
      entities.push({name:card.name, statKey:checkStat||'for', value:gravity});
    }
    const deckKey = state.currentDraw.incontroDeck;
    if(deckKey==='demoni') entities.forEach(e=>e.demon=true);
    if(deckKey==='nonmorti') entities.forEach(e=>e.undead=true);
    state.currentDraw.combat = { entities, rounds:0, checkStat, randomEach:card.check==='random', choiceEach:card.check==='choice', damageStat:card.damageStat||'pv' };
  }
  const cb = state.currentDraw.combat;
  const aliveEntities = cb.entities.filter(e=>e.hp===undefined || e.hp>0);
  const totalHp = cb.entities.reduce((s,e)=>s+(e.hp===undefined?e.value:e.hp),0);
  const loseExtra = onLoseExtraLabel(card.onLoseExtra);
  return `
    <div class="mb1"><strong>Entità:</strong> ${cb.entities.map(e=>`${e.name} (${STAT_LABEL[e.statKey]||''} ${e.value}, PV ${e.hp===undefined?e.value:e.hp})`).join(' · ')}</div>
    <p class="hint">Ogni giro: i colpi a segno del gruppo tolgono PV alle entità; il danno delle entità che supera quello inflitto passa al gruppo, -1 ${STAT_LABEL[cb.damageStat]} a testa a rotazione.</p>
    ${cb.choiceEach ? `<p class="hint">Ogni personaggio sceglie su quale caratteristica (For/Int/Des) giocare questa Contesa.</p>`:''}
    ${loseExtra ? `<p class="hint">⚠️ Se il danno passa oltre le difese: anche ${loseExtra}.</p>` : ''}
    <div id="combatLog"></div>
    <div class="row mt1">
      <button class="primary" id="btnRoundFight">🎲 Tira un giro di combattimento</button>
      ${cb.rounds>0?`<button id="btnFlee">↩️ Ritirati nel portale</button>`:''}
    </div>
  `;
}
function bindCombatPanel(plane, card, acts){
  const cb = state.currentDraw.combat;
  const btn = document.getElementById('btnRoundFight');
  if(btn) btn.onclick=()=>{
    fightRound(plane, card, acts, cb);
    render();
    setTimeout(renderIncontroAction,0);
  };
  const flee = document.getElementById('btnFlee');
  if(flee) flee.onclick=()=>{
    const minDes = Math.min(...acts.map(c=>effectiveStat(c,'des')));
    const roll = d6();
    const success = roll<=minDes || roll===6;
    logMsg(`↩️ Il gruppo tenta la ritirata verso il portale: check di gruppo su Destrezza (vale la più bassa presente, ${minDes}) — ${roll} vs ${minDes} → ${success?'RIUSCITA':'FALLITA'}.`, success?'good':'warn');
    if(success){
      logMsg('↩️ Il gruppo raggiunge il portale e interrompe lo scontro.','good');
      if(card.persistent){ persistCombat(plane, cb); }
      // scappati in tempo: si evitano anche gli effetti di fine turno del piano (Veleno/Tempesta).
      state.currentDraw.skipFineTurno = true;
      finishIncontro();
    } else {
      logMsg('↩️ La ritirata fallisce: le entità hanno un altro giro per colpire prima di poter riprovare a scappare.','warn');
      fightRound(plane, card, acts, cb);
      render();
      setTimeout(renderIncontroAction,0);
    }
  };
}
function fightRound(plane, card, acts, cb){
  if(!acts || acts.length===0){ logMsg('💀 Nessun personaggio cosciente può più combattere: lo scontro si interrompe.','bad'); finishIncontro(); return; }
  cb.rounds++;
  let log=[];
  let teamDmg=0;
  acts.forEach(c=>{
    let stat = cb.checkStat;
    if(cb.randomEach) stat = STATS[Math.floor(Math.random()*6)];
    if(cb.choiceEach) stat = 'for'; // simplificazione dichiarata: default a Forza invece di scelta per round
    const a=resolveAttack(c,stat);
    teamDmg+=a.dmg;
    log.push({who:c.name, roll:a.roll, stat, hit:a.hit, dmg:a.dmg, dardo:a.dardo});
  });
  cb.entities.forEach(e=>{ if(e.hp===undefined) e.hp=e.value; });
  let entityDmg=0;
  if(cb.freezeNextRound){
    cb.freezeNextRound=false;
    log.push({who:'(Scettro di Congelamento)', roll:null, stat:null, hit:false, dmg:0, isEntity:true, frozen:true});
  } else {
    cb.entities.forEach(e=>{
      if(e.hp<=0) return;
      const r=d6(); const hit = r<=e.value; // nat6 always fails for entities
      if(hit) entityDmg+=e.value;
      log.push({who:e.name, roll:r, stat:e.statKey, hit, dmg:hit?e.value:0, isEntity:true});
    });
  }
  // apply team damage to entities (focus fire lowest hp first)
  let remaining=teamDmg;
  cb.entities.sort((a,b)=>(a.hp||a.value)-(b.hp||b.value));
  cb.entities.forEach(e=>{
    if(remaining<=0||e.hp<=0) return;
    const take=Math.min(remaining,e.hp);
    e.hp-=take; remaining-=take;
  });
  const passThrough = Math.max(0, entityDmg - teamDmg);
  logMsg(`⚔️ Giro ${cb.rounds}: team infligge ${teamDmg} danni; entità infliggono ${entityDmg} (passano ${passThrough}).`);
  log.forEach(l=>{
    if(l.frozen){ logMsg(`　 ❄️ Le entità non mettono a segno colpi questo giro (Scettro di Congelamento).`); return; }
    const rollLabel = l.dardo?'Dardo Incantato':'tiro '+l.roll;
    logMsg(`　 ${l.isEntity?'👹':'🙂'} ${l.who}: ${rollLabel} ${l.hit?'✔':'✘'}${l.dmg?` (${l.dmg} dmg)`:''}`);
  });
  if(passThrough>0){
    let dmgStat = card.damageStat||'pv';
    const targets = passthroughTargets(acts);
    let idx=0;
    for(let i=0;i<passThrough;i++){
      const target = targets[idx%targets.length];
      applyCombatPassthrough(target, dmgStat, {family:plane.family, planeId:plane.id, combat:true});
      idx++;
    }
  }
  if(card.onLoseExtra && passThrough>0){
    acts.forEach(c=>{
      if(card.onLoseExtra==='loseTurn'){ c.skipNextIncontro=true; logMsg(`⏳ ${c.name} perde anche il turno: non parteciperà all'Incontro del prossimo piano.`,'warn'); }
      if(card.onLoseExtra==='tempDebuffSan') applyTempDebuff(c,'san');
      if(card.onLoseExtra==='tempDebuffRandom') applyTempDebuff(c,STATS[Math.floor(Math.random()*6)]);
    });
  }
  const allDead = cb.entities.every(e=>e.hp<=0);
  if(allDead){
    logMsg('🏆 Tutte le entità sono state sconfitte.');
    grantCombatReward(plane, card, acts, cb);
    finishIncontro();
  }
}
function persistCombat(plane, cb){
  state.pendingPersistent = state.pendingPersistent||{};
  state.pendingPersistent[plane.id] = cb;
}
function grantCombatReward(plane, card, acts, cb){
  if(state.currentDraw && state.currentDraw.drenaggioActive && acts.length){
    acts[0].resources += 1;
    logMsg(`🔮 Drenaggio d'Essenza: ${acts[0].name} ottiene anche 1 risorsa planare extra.`,'good');
  }
  // Bottino: piani fisici → oggetto/i (2 invece di 1 contro un mostro di caratteristica 3+),
  // dato a chi ne ha meno (a caso se pari — al tavolo decidono comunque i giocatori). Piani
  // eterei → +1 alla caratteristica nativa del piano, a chi ce l'ha più bassa (a caso se pari),
  // permanente invece che temporaneo se il mostro/boss ha caratteristica 3+.
  if(acts.length){
    const type = plane.type || FAMILIES[plane.family]?.type;
    const value = cb && cb.entities.length ? Math.max(...cb.entities.map(e=>e.value||0)) : 2;
    if(type==='fisico'){
      const n = value>=3 ? 2 : 1;
      for(let i=0;i<n;i++){
        const it = drawOggetto();
        if(!it) break;
        const minN = Math.min(...acts.map(c=>c.inventory.length));
        const candidates = acts.filter(c=>c.inventory.length===minN);
        const who = candidates[Math.floor(Math.random()*candidates.length)];
        who.inventory.push(it);
        logMsg(`🎁 ${who.name} trova ${OGGETTI_BY_ID[it].name}.`,'good');
      }
    } else {
      const stat = nativeStatFor(plane);
      const permanent = value>=3;
      const minVal = Math.min(...acts.map(c=>c.stats[stat]));
      const candidates = acts.filter(c=>c.stats[stat]===minVal);
      const who = candidates[Math.floor(Math.random()*candidates.length)];
      if(permanent){
        who.stats[stat]=Math.min(6,who.stats[stat]+1);
        who.start[stat]=Math.max(who.start[stat],who.stats[stat]);
        logMsg(`🎁 ${who.name} ottiene +1 PERMANENTE a ${STAT_LABEL[stat]} (boss sconfitto).`,'good');
      } else {
        applyTempBonus(who, stat, 1);
      }
    }
  }
  if(state.pattoOnoreActive && plane.family==='entropia' && acts.length){
    const it = drawOggetto();
    if(it){ const who=acts[Math.floor(Math.random()*acts.length)]; who.inventory.push(it); logMsg(`🤝 Patto d'Onore: vittoria contro l'Entropia, ${who.name} trova ${OGGETTI_BY_ID[it].name}.`,'good'); }
  }
}

/* ---------- reward cards ---------- */
function renderRewardPanel(card, acts){
  const r=card.reward||{};
  switch(r.type){
    case 'resource': return `<button class="primary" id="btnApplyReward">+${r.n} risorsa planare per il gruppo</button>`;
    case 'heal': return `<div>${acts.map(c=>`<button class="small" data-heal="${c.id}">Cura ${r.n} PV → ${c.name}</button>`).join(' ')}<button id="btnDeclineReward">Rifiuta, non serve</button></div>`;
    case 'item': return `<button class="primary" id="btnApplyReward">Pesca un oggetto</button><div class="row mt1">${acts.map(c=>`<button class="small" data-giveitem="${c.id}">a ${c.name}</button>`).join('')}</div>`;
    case 'peek': return `<button class="primary" id="btnApplyReward">Guarda ${r.n} carta/e in cima al mazzo Piani</button>`;
    case 'peekBottom': return `<button class="primary" id="btnApplyReward">Guarda la carta in fondo al mazzo Piani</button>`;
    case 'spellBoost': return `<button class="primary" id="btnApplyReward">Il prossimo spell di un personaggio è potenziato (+100%, segna manualmente)</button>`;
    case 'restChoice': return `<button class="primary" id="btnApplyReward">Recupero + 1 San o Anima extra a scelta</button>`;
    case 'groupHealCure': {
      const debuffed = acts.filter(c=>activeTempDebuffs(c).length>0);
      if(!debuffed.length) return `<button class="primary" id="btnApplyReward">Applica: +1 PV a tutti (nessun depotenziamento da guarire)</button>`;
      return `<p class="hint">+1 PV a tutti i presenti. Scegli anche chi guarisce da un depotenziamento temporaneo:</p><div>${debuffed.map(c=>`<button class="small" data-curedebuff="${c.id}">${escapeHtml(c.name)}</button>`).join(' ')}</div>`;
    }
    case 'removePermDebuff': return `<div>${acts.map(c=>`<button class="small" data-rmperm="${c.id}">Rimuovi 1 depotenz. perm. a ${c.name}</button>`).join(' ')}</div>`;
    case 'sanheal': return `<div>${acts.map(c=>`<button class="small" data-sanheal="${c.id}">+1 San a ${c.name}</button>`).join(' ')}</div>`;
    case 'healChoiceSanAnima': return `<div>${acts.map(c=>`<button class="small" data-hcsa="${c.id}-san">+1 San a ${c.name}</button><button class="small" data-hcsa="${c.id}-anima">+1 Anima a ${c.name}</button>`).join(' ')}</div>`;
    case 'choiceLoss': return `<div>${acts.map(c=>`<span style="display:block;margin-bottom:.3rem;">${c.name}: <button class="small" data-lose="${c.id}-pv">-1 PV</button> <button class="small" data-lose="${c.id}-item" ${c.inventory.length?'':'disabled'}>Perdi oggetto</button></span>`).join('')}</div>`;
    case 'choice3': return `<div>${acts.length?`<button class="small" data-choice3="resistance">🛡️ Resistenza per tutto il gruppo (prossimo piano)</button>`:''}<button class="small" data-choice3="peek">👁️ Guarda 2 carte in cima al mazzo Piani, scegli quale resta in cima</button><button class="small" data-choice3="reshuffle">🔀 Rimescola il mazzo Piani</button></div>`;
    case 'itemPlusCheck': return `<p class="hint">⚠️ Se il check di Sanità fallisce: depotenziamento temporaneo a San.</p><div>${acts.map(c=>`<button class="small" data-itemcheck="${c.id}">Pesca oggetto e fai il check di Sanità → ${c.name}</button>`).join(' ')}</div>`;
    case 'syncJump': return `<button class="primary" id="btnApplyReward">Segna: il prossimo salto sarà lo stesso per tutti i separati</button>`;
    case 'resourceForSacrifice': return `<div>${acts.map(c=>`<div style="margin-bottom:.3rem;"><button class="small" data-sacrifice="${c.id}-pv">${c.name}: sacrifica 1 PV → +1 risorsa</button> <button class="small" data-sacrifice="${c.id}-item" ${c.inventory.length?'':'disabled'}>sacrifica oggetto → +1 risorsa</button></div>`).join('')}<button id="btnDeclineReward">Rifiuta, non fare nulla</button></div>`;
    case 'tradeItemForItemOrResource': return `<div>${acts.map(c=>`<div style="margin-bottom:.3rem;">${c.name}: <button class="small" data-tradeitem="${c.id}-item" ${c.inventory.length?'':'disabled'}>scambia oggetto → nuovo oggetto</button> <button class="small" data-tradeitem="${c.id}-resource" ${c.inventory.length?'':'disabled'}>scambia oggetto → risorsa</button></div>`).join('')}<button id="btnDeclineReward">Rifiuta il baratto</button></div>`;
    case 'tradeForItem': return `<div>${acts.map(c=>`<div style="margin-bottom:.3rem;">${c.name}: <button class="small" data-tradepay="${c.id}-resource" ${c.resources>0?'':'disabled'}>paga 1 risorsa → oggetto</button> <button class="small" data-tradepay="${c.id}-anima">paga 1 Anima → oggetto</button></div>`).join('')}<button id="btnDeclineReward">Rifiuta</button></div>`;
    case 'tradeResourceForItem': return `<div>${acts.map(c=>`<button class="small" data-tradepay="${c.id}-resource" ${c.resources>0?'':'disabled'}>${c.name}: paga 1 risorsa → oggetto</button>`).join(' ')}<button id="btnDeclineReward">Rifiuta</button></div>`;
    case 'pattoOnore': return `<button class="primary" id="btnApplyReward">Sigilla il patto: da ora ogni vittoria contro l'Entropia frutta un oggetto al gruppo</button>`;
    default: return `<button class="primary" id="btnApplyReward">Applica e continua</button>`;
  }
}
function bindRewardPanel(card, acts){
  const r=card.reward||{};
  const done=()=>{
    // Rifugio temporaneo (e futuri ripari simili): qualunque sia la scelta, il riparo protegge
    // anche dall'effetto di fine turno del piano (Veleno/Tempesta/Piano Negativo).
    if(card.safeRespite && state.currentDraw) state.currentDraw.skipFineTurno = true;
    finishIncontro();
  };
  const genericBtn=document.getElementById('btnApplyReward');
  if(genericBtn) genericBtn.onclick=()=>{
    if(r.type==='resource'){ acts.forEach(c=>{}); if(acts[0]) acts[0].resources+=r.n; logMsg(`💠 Il gruppo ottiene ${r.n} risorsa planare (assegnata a ${acts[0]?.name}).`); }
    if(r.type==='item'){ const it=drawOggetto(); if(it && acts[0]){ acts[0].inventory.push(it); logMsg(`🎁 ${acts[0].name} trova ${OGGETTI_BY_ID[it].name}.`);} }
    if(r.type==='peek'||r.type==='peekBottom'){ showPeekModal(r); return; }
    if(r.type==='spellBoost'){ if(acts[0]){ acts[0].nextSpellBoost=true; logMsg(`✨ Il prossimo spell di ${acts[0].name} è potenziato.`);} }
    if(r.type==='restChoice'){ acts.forEach(c=>{ recuperoFor(c); }); if(acts[0]) healStat(acts[0],'san',1); }
    if(r.type==='groupHealCure'){ acts.forEach(c=>healStat(c,'pv',1)); }
    if(r.type==='syncJump'){ state.pendingReunion=true; logMsg('🔗 Segnale intercettato: al prossimo salto tutti i gruppi separati si riuniranno in uno solo.','good'); }
    if(r.type==='pattoOnore'){ state.pattoOnoreActive=true; logMsg("🤝 Patto d'Onore sigillato: da ora ogni vittoria contro l'Entropia farà trovare un oggetto al gruppo.",'good'); }
    done();
  };
  document.querySelectorAll('[data-heal]').forEach(b=>b.onclick=()=>{ const c=acts.find(x=>x.id===b.dataset.heal); healStat(c,'pv',r.n); done(); });
  document.querySelectorAll('[data-curedebuff]').forEach(b=>b.onclick=()=>{
    acts.forEach(c=>healStat(c,'pv',1));
    const c=acts.find(x=>x.id===b.dataset.curedebuff);
    const d=activeTempDebuffs(c)[0];
    if(d) cureOneDebuff(c,d);
    done();
  });
  document.querySelectorAll('[data-giveitem]').forEach(b=>b.onclick=()=>{ const c=acts.find(x=>x.id===b.dataset.giveitem); const it=drawOggetto(); if(it){ c.inventory.push(it); logMsg(`🎁 ${c.name} trova ${OGGETTI_BY_ID[it].name}.`);} done(); });
  document.querySelectorAll('[data-rmperm]').forEach(b=>b.onclick=()=>{ const c=acts.find(x=>x.id===b.dataset.rmperm); openRemovePermModal(c); });
  document.querySelectorAll('[data-sanheal]').forEach(b=>b.onclick=()=>{ const c=acts.find(x=>x.id===b.dataset.sanheal); healStat(c,'san',1); done(); });
  document.querySelectorAll('[data-hcsa]').forEach(b=>b.onclick=()=>{ const [id,stat]=b.dataset.hcsa.split('-'); const c=acts.find(x=>x.id===id); healStat(c,stat,1); done(); });
  document.querySelectorAll('[data-lose]').forEach(b=>b.onclick=()=>{ const [id,what]=b.dataset.lose.split('-'); const c=acts.find(x=>x.id===id); if(what==='pv') applyDamage(c,'pv',1,{ignoreResistance:true}); else if(c.inventory.length){ c.inventory.pop(); } done(); });
  document.querySelectorAll('[data-itemcheck]').forEach(b=>b.onclick=()=>{
    const c=acts.find(x=>x.id===b.dataset.itemcheck);
    const it=drawOggetto();
    if(it){ c.inventory.push(it); logMsg(`🎁 ${c.name} trova ${OGGETTI_BY_ID[it].name}, ma la scoperta lo turba.`); }
    const r=checkRoll(c,'san');
    logMsg(`🧠 ${c.name} check Sanità: ${r.roll} vs ${r.val} → ${r.success?'superato':'FALLITO'}.`);
    if(!r.success) applyTempDebuff(c,'san');
    done();
  });
  document.querySelectorAll('[data-choice3]').forEach(b=>b.onclick=()=>{
    const mode=b.dataset.choice3;
    if(mode==='resistance'){ acts.forEach(c=>{ c.wildcardResistance=true; }); logMsg('🛡️ Il gruppo ottiene Resistenza universale per il prossimo piano (para il primo danno d\'ingresso, qualunque famiglia).','good'); done(); }
    else if(mode==='reshuffle'){ reshuffleMazzoPiani(); done(); }
    else if(mode==='peek'){ showPeekModal({type:'peek', n:2, chooseBottom:true}); }
  });
  const declineBtn=document.getElementById('btnDeclineReward');
  if(declineBtn) declineBtn.onclick=()=>{ logMsg('🚫 Il gruppo rinuncia alla ricompensa: nessun sacrificio, nessuna risorsa.'); done(); };
  document.querySelectorAll('[data-sacrifice]').forEach(b=>b.onclick=()=>{
    const [id,what]=b.dataset.sacrifice.split('-'); const c=acts.find(x=>x.id===id);
    let sacrificed=false;
    if(what==='pv'){ applyDamage(c,'pv',1,{ignoreResistance:true}); sacrificed=true; }
    else if(c.inventory.length){ c.inventory.pop(); sacrificed=true; }
    if(sacrificed){ c.resources+=1; logMsg(`💠 ${c.name} ottiene 1 risorsa planare.`); }
    else logMsg(`⚠️ ${c.name} non ha nulla da sacrificare.`,'warn');
    done();
  });
  document.querySelectorAll('[data-tradeitem]').forEach(b=>b.onclick=()=>{
    const [id,mode]=b.dataset.tradeitem.split('-'); const c=acts.find(x=>x.id===id);
    if(!c.inventory.length) return;
    const lost=c.inventory.pop();
    if(mode==='item'){ const it=drawOggetto(); if(it){ c.inventory.push(it); logMsg(`🔁 ${c.name} scambia ${OGGETTI_BY_ID[lost]?.name} con ${OGGETTI_BY_ID[it].name}.`,'good');} }
    else { c.resources+=1; logMsg(`🔁 ${c.name} scambia ${OGGETTI_BY_ID[lost]?.name} con 1 risorsa planare.`,'good'); }
    done();
  });
  document.querySelectorAll('[data-tradepay]').forEach(b=>b.onclick=()=>{
    const [id,mode]=b.dataset.tradepay.split('-'); const c=acts.find(x=>x.id===id);
    if(mode==='resource'){ if(c.resources<=0) return; c.resources-=1; } else { applyAnimaLoss(c,1); }
    const it=drawOggetto(); if(it){ c.inventory.push(it); logMsg(`🤝 ${c.name} paga ${mode==='resource'?'1 risorsa':'1 Anima'} e ottiene ${OGGETTI_BY_ID[it].name}.`,'good'); }
    done();
  });
}
function openRemovePermModal(c){
  const stats = STATS.filter(s=>s!=='pv' && c.permDebuffN[s]>0);
  if(stats.length===0){
    logMsg(`✨ ${c.name} non ha alcun depotenziamento permanente da rimuovere: l'archivio non trova nulla da restituire.`);
    finishIncontro();
    return;
  }
  openModal(`<h3>📜 Custode di Eternità</h3><p>Scegli quale depotenziamento permanente rimuovere a ${escapeHtml(c.name)}:</p>
    <div class="row">${stats.map(s=>`<button class="small" data-rmpermstat="${s}">${STAT_LABEL[s]} (-${c.permDebuffN[s]} attuale)</button>`).join('')}</div>`);
  document.querySelectorAll('[data-rmpermstat]').forEach(b=>b.onclick=()=>{
    const stat=b.dataset.rmpermstat;
    c.permDebuffN[stat]--;
    c.stats[stat]=Math.min(c.start[stat], c.stats[stat]+1);
    logMsg(`✨ ${c.name}: un depotenziamento permanente a ${STAT_LABEL[stat]} viene rimosso.`,'good');
    closeModal();
    finishIncontro();
  });
}
function showPeekModal(r, usedRedraw){
  const n = r.n||1;
  const top = state.mazzoPiani.slice(-n).reverse(); // deck stored with next-draw at index0 via shift, so top = index0.. wait we shift from front
  render(); // no-op, just ensure state consistent
  const cards = r.type==='peekBottom' ? [state.mazzoPiani[state.mazzoPiani.length-1]] : state.mazzoPiani.slice(0,n);
  const names = cards.map(id=>id==='__PT__'?'Piano Terreno (segnaposto)':PIANI_BY_ID[id]?.name);
  const stasi = inStasi();
  let actionsHtml = '';
  if(stasi){
    actionsHtml = `<p class="hint">⏳ Qui a Stasi il mazzo Piani non è manipolabile: puoi solo guardare, non riordinare né scartare.</p>`;
  } else {
    if(r.discard && !usedRedraw){ actionsHtml += `<div class="row mt1">${cards.map((id,i)=>`<button class="small" data-discardpeek="${i}">Scarta in fondo #${i+1} e pesca un'altra</button>`).join('')}</div>`; }
    if(r.chooseBottom){ actionsHtml += `<div class="row mt1">${cards.map((id,i)=>`<button class="small" data-sendbottom="${i}">Manda in fondo #${i+1}, lascia le altre in cima</button>`).join('')}</div>`; }
    if(r.type==='peekBottom'){ actionsHtml += `<div class="row mt1"><button class="primary" id="btnMoveBottomTop">Porta questa carta in cima</button></div>`; }
  }
  openModal(`<h3>👁️ Anteprima mazzo Piani</h3><ul>${names.map(n=>`<li>${n}</li>`).join('')}</ul>
    ${actionsHtml}
    <div class="row mt1"><button id="btnClosePeek">Chiudi</button></div>`);
  const closeBtn=document.getElementById('btnClosePeek'); if(closeBtn) closeBtn.onclick=()=>{ closeModal(); finishIncontro(); };
  const moveBtn=document.getElementById('btnMoveBottomTop');
  if(moveBtn) moveBtn.onclick=()=>{ const bottom=state.mazzoPiani.pop(); state.mazzoPiani.unshift(bottom); logMsg('🔮 La carta in fondo al mazzo diventa la prossima destinazione.'); closeModal(); finishIncontro(); };
  document.querySelectorAll('[data-discardpeek]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.discardpeek;
    const id = state.mazzoPiani.splice(i,1)[0];
    state.mazzoPiani.push(id);
    if(r.noRedraw){
      logMsg('🔮 Carta scartata in fondo al mazzo: senza pescarne subito un\'altra, il prossimo salto pescherà semplicemente la nuova carta in cima.');
      closeModal(); finishIncontro();
    } else {
      logMsg('🔮 Carta scartata in fondo al mazzo, se ne pesca una nuova al posto suo.');
      closeModal(); showPeekModal(r, true);
    }
  });
  document.querySelectorAll('[data-sendbottom]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.sendbottom;
    const id = state.mazzoPiani.splice(i,1)[0];
    state.mazzoPiani.push(id);
    logMsg(`🔮 Una delle ${cards.length} carte viste viene mandata in fondo al mazzo; le altre restano in cima.`);
    closeModal(); finishIncontro();
  });
}

  document.querySelectorAll('[data-m-item-gain]').forEach(b=>b.onclick=()=>{ const c=acts.find(x=>x.id===b.dataset.mItemGain); const it=drawOggetto(); if(it){ c.inventory.push(it); logMsg(`🎁 ${c.name} ottiene ${OGGETTI_BY_ID[it].name}.`);} markManualUsed(c,'itemgain'); render(); setTimeout(renderIncontroAction,0); });

// Piani con un effetto "a fine turno" invece che d'ingresso: colpiscono solo se il gruppo
// non è riuscito a evitare del tutto l'Incontro del turno (scontro fuggito con successo, o
// tutti riusciti a restare nascosti) — in quel caso state.currentDraw.skipFineTurno viene
// impostato prima di chiamare finishIncontro(). Nessuna gestione di più turni di permanenza:
// si applica una volta sola, a fine di QUESTO turno.
const FINE_TURNO_PLANES = new Set(['veleno','tempesta']);
function hasFineTurnoRisk(plane){
  if(!plane) return false;
  if(FINE_TURNO_PLANES.has(plane.id)) return true;
  if(plane.family==='nonmorti' && plane.girone>=2) return true;
  return false;
}
function applyFineTurnoIfNeeded(){
  const plane = currentPlane();
  if(!hasFineTurnoRisk(plane)) return;
  const acts = activeChars();
  if(!acts.length) return;
  const ctx = {family: plane.family, planeId: plane.id};
  if(plane.id==='veleno'){
    acts.forEach(c=>applyDamage(c,'pv',1,ctx));
    logMsg('☠️ Veleno: il turno finisce senza scampo, il gruppo presente subisce danno.','warn');
  } else if(plane.id==='tempesta'){
    const v=acts[Math.floor(Math.random()*acts.length)];
    applyDamage(v,'pv',1,ctx);
    logMsg(`⚡ Tempesta: fulmine a fine turno su ${v.name}.`,'warn');
  } else if(plane.family==='nonmorti' && plane.girone>=2){
    logMsg('🧠 Piano Negativo: la mente si logora, a fine turno il gruppo presente rischia la Follia.','warn');
    acts.forEach(c=>applySanLoss(c,1));
  }
}
function finishIncontro(){
  if(!state.currentDraw || !state.currentDraw.skipFineTurno) applyFineTurnoIfNeeded();
  const reunionPlaneId = state.currentDraw && state.currentDraw.pendingReunionPlaneId;
  state.currentDraw = null;
  if(reunionPlaneId){
    // Aria: l'Incontro extra di chi era stato sbalzato via è stato risolto per intero —
    // solo ORA il gruppo riunito affronta davvero il secondo Incontro promesso dal testo.
    const plane = PIANI_BY_ID[reunionPlaneId];
    if(plane && activeChars().length){
      logMsg(`💨 Il gruppo si riunisce: tutti insieme affrontano un secondo Incontro su ${plane.name}.`);
      drawIncontroForPlane(plane, null);
      return;
    }
  }
  render();
}

/* ---------- Recupero ---------- */
function recuperoFor(c){
  const parts = [];
  const beforePv = c.stats.pv;
  healStat(c,'pv',1);
  if(c.stats.pv>beforePv) parts.push(`+1 PV (${beforePv}→${c.stats.pv})`);
  const debuffed = activeTempDebuffs(c);
  debuffed.forEach(s=>cureOneDebuff(c,s));
  if(debuffed.length) parts.push(`guarisce ${debuffed.map(s=>STAT_LABEL[s]).join(', ')}`);
  const spellsGained = [];
  Object.entries(CLASSES[c.cls].affinity||{}).forEach(([school,base])=>{
    const have = c.spells.filter(id=>SPELLS_BY_ID[id] && SPELLS[school].some(s=>s.id===id)).length;
    if(have<base){ const s=drawSpell(school); if(s){ c.spells.push(s); spellsGained.push(SPELLS_BY_ID[s]?.name||school); } }
  });
  if(spellsGained.length) parts.push(`pesca ${spellsGained.join(', ')}`);
  const chargeRefreshed = CLASSES[c.cls].special && !c.charges.special;
  c.charges.special = true;
  if(chargeRefreshed) parts.push('ricarica l\'abilità di classe');
  const boosted = Object.keys(c.tempBonus||{}).filter(s=>c.tempBonus[s]);
  if(boosted.length){
    boosted.forEach(s=>{ c.stats[s]=Math.max(1,c.stats[s]-c.tempBonus[s]); });
    c.tempBonus={};
    parts.push(`perde il bonus temporaneo a ${boosted.map(s=>STAT_LABEL[s]).join(', ')}`);
  }
  const corroded = Object.keys(c.corroded||{}).filter(slot=>c.corroded[slot]);
  if(corroded.length){
    corroded.forEach(slot=>{ c.corroded[slot]=false; });
    parts.push(`l'equipaggiamento corroso torna a funzionare normalmente`);
  }
  logMsg(parts.length ? `🛌 ${c.name} recupera: ${parts.join('; ')}.` : `🛌 ${c.name} riposa, ma non aveva nulla da recuperare.`);
}

function resolvePianoTerreno(){

  if(id==='finale_c'){
    // "resta nel mazzetto, non va tolta": a differenza delle altre 11, non si consuma.

    state.pianoTerrenoUsed.push(id);

function renderBossFight(dest, boss, stat, onWin){
  // Solo le destinazioni esplicitamente segnate finale:true (L'Antro della Creatura,
  // Finale B) portano alla vittoria. Un boss "di passaggio" come il Fondo del Mare
  // (serve solo a risalire in superficie) non deve mai concludere la partita.
  onWin = onWin || (()=>{
    closeModal(); state.currentDraw=null; render();
    if(dest.finale){
      openPianoTerrenoModal({id:'__win__', name:'Finale B', text:'Il gruppo ha sconfitto '+boss.name+'!', kind:'finaleA'});
    } else {
      logMsg(`🏆 ${boss.name} è sconfitto: il gruppo può continuare il viaggio.`,'good');
    }
  });
  openModal(`<h3>⚔️ ${boss.name}</h3><div id="bossArea"></div>`);
  const cb = { entities:[{name:boss.name, statKey:stat, value:boss.value, hp:boss.value}], rounds:0, checkStat:stat, damageStat:'pv' };
  state.currentDraw.combat = cb;
  const plane = {family:'generico', type:'etereo', name:boss.name};
  function draw(){
    document.getElementById('bossArea').innerHTML = `<p>${boss.name}: PV ${cb.entities[0].hp}/${boss.value}</p><div class="row"><button class="primary" id="bfRound">Tira un giro</button>${cb.rounds>0?'<button id="bfFlee">Ritirati</button>':''}</div>`;
    document.getElementById('bfRound').onclick=()=>{
      const fighters = activeChars();
      if(fighters.length===0){
        logMsg('💀 Nessun personaggio cosciente può più combattere: lo scontro si interrompe.','bad');
        closeModal(); state.currentDraw=null; render();
        return;
      }
      fightRoundGeneric(cb, fighters, plane, {damageStat:'pv'});
      if(cb.entities[0].hp<=0){
        logMsg(`🏆 ${boss.name} è sconfitto!`,'good');
        onWin();
      } else draw();
    };
    const fleeBtn=document.getElementById('bfFlee');
    if(fleeBtn) fleeBtn.onclick=()=>{ logMsg('↩️ Il gruppo si ritira dallo scontro col boss.'); closeModal(); state.currentDraw=null; render(); };
  }
  draw();
}
function fightRoundGeneric(cb, acts, plane, opts){
  if(!acts || acts.length===0) return; // guardia di sicurezza: il chiamante deve controllare prima di invocare
  cb.rounds++;
  let teamDmg=0, entityDmg=0;
  acts.forEach(c=>{
    const a=resolveAttack(c,cb.checkStat);
    teamDmg+=a.dmg;
    logMsg(`　 🙂 ${c.name}: ${a.dardo?'Dardo Incantato':'tiro '+a.roll} ${a.hit?'✔':'✘'}${a.dmg?` (${a.dmg} dmg)`:''}`);
  });
  cb.entities.forEach(e=>{
    if(e.hp<=0) return;
    const r=d6(); const hit=r<=e.value;
    if(hit) entityDmg+=e.value;
    logMsg(`　 👹 ${e.name}: tiro ${r} ${hit?'✔':'✘'}`);
  });
  let remaining=teamDmg;
  cb.entities.forEach(e=>{ if(remaining<=0||e.hp<=0) return; const take=Math.min(remaining,e.hp); e.hp-=take; remaining-=take; });
  const passThrough=Math.max(0,entityDmg-teamDmg);
  logMsg(`⚔️ Giro ${cb.rounds}: team ${teamDmg} dmg, entità ${entityDmg} dmg (passano ${passThrough}).`);
  if(passThrough>0){ const targets=passthroughTargets(acts); let idx=0; for(let i=0;i<passThrough;i++){ const t=targets[idx%targets.length]; applyCombatPassthrough(t, opts.damageStat||'pv', {family:plane.family, planeId:plane.id, combat:true}); idx++; } }
}

    // alcuni spell aprono un modal per scegliere il bersaglio (Sigillo, Egida, Benedizione,
    // Trasmutazione, Vaticinio, Teletrasporto, cure): riaprire subito il pannello Gestisci

    // true quando ha aperto un modal proprio, e in quel caso si salta la riapertura.

}
function openGiveItemModal(c, source){
  const itemId = source.type==='inventory' ? c.inventory[source.idx]
    : source.type==='ring' ? c.equipped.rings[source.idx]
    : c.equipped[source.slot];
  if(!itemId) return;
  // solo a un compagno nello stesso gruppo — non a chi è separato altrove.
  const mates = groupMembers(groupOf(c)).filter(x=>x.id!==c.id);
  if(mates.length===0){
    logMsg(`⚠️ ${c.name} non ha nessun compagno nel proprio gruppo a cui dare oggetti in questo momento.`,'warn');
    return;
  }
  const it = OGGETTI_BY_ID[itemId];
  openModal(`<h3>🤝 Dai un oggetto</h3><p>A chi vuoi dare <strong>${escapeHtml(it?.name||itemId)}</strong>?</p>
    <div class="row">${mates.map(t=>`<button class="small" data-giveitemto="${t.id}">${escapeHtml(t.name)}</button>`).join('')}</div>`);
  document.querySelectorAll('[data-giveitemto]').forEach(b=>b.onclick=()=>{
    const t=mates.find(x=>x.id===b.dataset.giveitemto);
    if(source.type==='inventory') c.inventory.splice(source.idx,1);
    else if(source.type==='ring') c.equipped.rings.splice(source.idx,1);
    else c.equipped[source.slot]=null;
    if(c.protectedItemId===itemId){
      c.protectedItemId=null;
      logMsg(`⏳ ${c.name}: la protezione della Statua di Stasi non segue l'oggetto donato, si perde.`,'warn');
    }
    t.inventory.push(itemId);
    logMsg(`🤝 ${c.name} dà ${it?.name||itemId} a ${t.name}.`,'good');
    closeModal();
    render();
    openCharManageModal(c.id);
  });
}
function useClassSpecial(c){
  const cls=CLASSES[c.cls];
  if(!c.charges.special){ logMsg(`${c.name}: abilità già scarica, serve un Recupero.`); return; }
  switch(cls.special){
    case 'dardo':
      c.charges.special=false; c.dardoReady=true;
      logMsg(`🪄 ${c.name} carica Dardo Incantato: nella prossima Contesa di Forza/Intelletto/Destrezza infliggerà 2 danni sicuri, senza bisogno di tirare.`);
      break;
    case 'forma_selvatica':
      c.charges.special=false;
      openFormaSelvaticaModal(c);
      break;
    case 'evocazione':
      c.charges.special=false;
      grantCompanion(c, 'Demone Minore', 1);
      break;
    case 'resistenza_universale':
      c.charges.special=false; c.monkShieldReady=true;
      logMsg(`🧘 ${c.name} è pronto ad annullare del tutto il prossimo danno subito, su qualunque caratteristica.`);
      break;
    case 'vista_piani': logMsg(`🔮 ${c.name} conosce già la carta in cima al mazzo Piani.`); showPeekModal({type:'peek',n:1}); break;
    case 'cura_bonus':
      c.charges.special=false; c.curaBonusReady=true;
      logMsg(`✨ ${c.name} si prepara: il primo Flusso lanciato su un compagno curerà anche 1 PV extra.`);
      break;
    default: c.charges.special=false; logMsg(`✳️ ${c.name} usa la propria abilità di classe.`);
  }
}
function openFormaSelvaticaModal(c){
  openModal(`<h3>🌿 Forma Selvatica</h3><p>Scegli due caratteristiche da scambiare temporaneamente (tornano come prima al prossimo salto):</p>
    <div class="row">${STATS.filter(s=>s!=='pv').map(s=>`<button class="small" data-fsstat="${s}">${STAT_LABEL[s]} (${c.stats[s]})</button>`).join('')}</div>
    <p class="hint" id="fsHint">Scegli la prima caratteristica.</p>`);
  let first=null;
  document.querySelectorAll('[data-fsstat]').forEach(b=>b.onclick=()=>{
    const s=b.dataset.fsstat;
    if(!first){ first=s; document.getElementById('fsHint').textContent=`Prima: ${STAT_LABEL[s]}. Ora scegli la seconda.`; return; }
    if(first===s){ return; }
    const a=first, bStat=s;
    const tmp=c.stats[a]; c.stats[a]=c.stats[bStat]; c.stats[bStat]=tmp;
    c.formaSelvaticaSwap = [a,bStat];
    logMsg(`🌿 ${c.name} usa Forma Selvatica: scambia ${STAT_LABEL[a]} e ${STAT_LABEL[bStat]} fino al prossimo salto.`);
    closeModal(); render();
  });
}
function revertFormaSelvatica(c){
  if(!c.formaSelvaticaSwap) return;
  const [a,b]=c.formaSelvaticaSwap;
  const tmp=c.stats[a]; c.stats[a]=c.stats[b]; c.stats[b]=tmp;
  logMsg(`🌿 ${c.name}: Forma Selvatica finisce, ${STAT_LABEL[a]} e ${STAT_LABEL[b]} tornano come prima.`);
  c.formaSelvaticaSwap=null;
}
function revertMirrorBoost(c){
  if(!c.mirrorBoost) return;
  Object.entries(c.mirrorBoost).forEach(([s,delta])=>{ c.stats[s]=Math.max(1,c.stats[s]-delta); });
  logMsg(`🪞 ${c.name}: il potenziamento del Labirinto degli Specchi finisce.`);
  c.mirrorBoost=null;
}
function applyPlaneDebuff(c, stat){
  if(c.planeDebuff[stat]) return; // già attivo per questa permanenza: non si applica due volte
  const before = c.stats[stat];
  const after = Math.max(1, before-1);
  if(after===before) return; // già al minimo: nessun malus reale, quindi nessun revert da tenere in sospeso
  c.stats[stat]=after;
  c.planeDebuff[stat]=true;
  logMsg(`⬇️ ${c.name} subisce un depotenziamento a ${STAT_LABEL[stat]} per tutta la permanenza nel piano (non curabile a Recupero, finisce lasciando il piano).`);
}
function revertPlaneDebuffs(c){
  if(!c.planeDebuff) { c.planeDebuff={}; return; }
  Object.keys(c.planeDebuff).forEach(s=>{
    if(c.planeDebuff[s]){ c.stats[s]=Math.min(6,c.stats[s]+1); }
  });
  c.planeDebuff={};
}
function revertPerPlaneBuffs(c){
  // Sigillo, Benedizione, Vaticinio: durano "finché si resta nel piano" / "per tutta la
  // permanenza" — finiscono al salto successivo, a prescindere da come è andata.
  if(c.sigilloActive){ c.sigilloActive=false; }
  if(c.dmgBonusPlane){ c.dmgBonusPlane=0; }
  if(c.contesaBonusPlane){ c.contesaBonusPlane=0; }
}
function useItem(c, idx){
  const id=c.inventory[idx]; const it=OGGETTI_BY_ID[id];
  if(!it) return;
  if(it.slot==='shield'){
    // uno scudo si imbraccia solo insieme a un'arma leggera — con arma pesante, "tutti" o
    // nessun'arma equipaggiata non è permesso.
    const weapon = c.equipped.weapon ? OGGETTI_BY_ID[c.equipped.weapon] : null;
    if(!weapon || weapon.tier!=='leggera'){
      logMsg(`⚠️ ${it.name}: uno scudo si imbraccia solo insieme a un'arma leggera. Equipaggia prima un'arma leggera.`,'warn');
      return;
    }
  }
  if(it.slot==='weapon' && it.tier!=='leggera' && c.equipped.shield){
    const oldShield = OGGETTI_BY_ID[c.equipped.shield];
    c.inventory.push(c.equipped.shield);
    c.equipped.shield = null;
    logMsg(`🛡️ ${c.name}: ${oldShield?.name||'lo scudo'} non si può più imbracciare con un'arma non leggera, torna nell'inventario.`,'warn');
  }
  if(it.slot==='weapon'||it.slot==='armor'||it.slot==='shield'){
    // equipaggiare deve TOGLIERE l'oggetto dall'inventario (altrimenti resta lì, identico,
    // col suo bottone "Usa/Equip" ancora cliccabile: sembra che equipaggiare non faccia nulla)
    // e restituire all'inventario l'eventuale oggetto già equipaggiato in quello slot.
    const old = c.equipped[it.slot];
    c.equipped[it.slot] = id;
    c.inventory.splice(idx,1);
    if(old) c.inventory.push(old);
    if(it.instantBonus) Object.entries(it.instantBonus).forEach(([s,n])=>{ c.stats[s]=Math.min(6,c.stats[s]+n); });
    const verb = it.slot==='weapon' ? 'equipaggia' : (it.slot==='armor' ? 'indossa' : 'imbraccia');
    logMsg(`${it.slot==='weapon'?'⚔️':'🛡️'} ${c.name} ${verb} ${it.name}.`);
    return;
  }
  if(it.slot==='ring'){ c.equipped.rings.push(id); if(it.instantBonus) Object.entries(it.instantBonus).forEach(([s,n])=>{ c.stats[s]=Math.min(6,c.stats[s]+n); }); c.inventory.splice(idx,1); logMsg(`💍 ${c.name} indossa ${it.name}.`); return; }
  if(it.consumable){
    if(it.heal && !it.cureDebuff && !it.giveResource){
      // pozioni di cura pure: si può scegliere il bersaglio (anche uno svenuto a 0 PV, per rimetterlo in piedi)
      openUseItemTargetModal(c, idx, it);
      return true;
    }
    if(it.heal) Object.entries(it.heal).forEach(([s,n])=>healStat(c,s,n));
    if(it.cureDebuff){ const d=activeTempDebuffs(c); if(d.length) cureOneDebuff(c,d[Math.floor(Math.random()*d.length)]); }
    if(it.giveResource) c.resources+=it.giveResource;
    logMsg(`🧪 ${c.name} usa ${it.name}.`);
    c.inventory.splice(idx,1);
    return;
  }
  if(it.selfRecupero){
    recuperoFor(c);
    logMsg(`🛌 ${it.name}: il piano corrente diventa Recupero solo per ${c.name}.`);
    c.inventory.splice(idx,1);
    return;
  }
  if(it.combatDamageAll){
    const cb = state.currentDraw && state.currentDraw.combat;
    if(!cb || !cb.entities || !cb.entities.some(e=>e.hp>0)){ logMsg(`⚠️ ${it.name}: nessuna entità presente da colpire in questo momento.`,'warn'); return; }
    cb.entities.forEach(e=>{ if(e.hp>0) e.hp -= it.combatDamageAll; });
    logMsg(`⚡ ${c.name} usa ${it.name}: ${it.combatDamageAll} danno diretto a tutte le entità presenti, senza tirare.`,'good');
    c.inventory.splice(idx,1);
    return;
  }
  if(it.spellBoostItem){
    c.nextSpellBoost = true;
    logMsg(`✨ ${c.name} usa ${it.name}: il prossimo incantesimo lanciato è potenziato (+100%).`);
    c.inventory.splice(idx,1);
    return;
  }
  if(it.stealthLikeItem){
    if(grantHidden(c, it.name)) c.inventory.splice(idx,1);
    return;
  }
  if(it.personalReunionItem){
    const myGroup = groupOf(c);
    if(!myGroup || !largestOtherGroup(myGroup)){ logMsg(`⚠️ ${it.name}: il gruppo non è separato in questo momento, non serve.`,'warn'); return; }
    c.pendingPersonalReunion = true;
    logMsg(`💍 ${c.name} usa ${it.name}: al prossimo salto il suo gruppo si riunirà con il resto.`);
    c.inventory.splice(idx,1);
    return;
  }
  if(it.cat==='protezione' && !it.slot){
    logMsg(`ℹ️ ${it.name} è un oggetto passivo: protegge automaticamente restando nell'inventario, non serve equipaggiarlo o usarlo.`);
    return;
  }
  if(it.freezeEntityItem){
    const cb = state.currentDraw && state.currentDraw.combat;
    if(!cb || !cb.entities.some(e=>e.hp>0)){ logMsg(`⚠️ ${it.name}: nessuno scontro in corso da congelare.`,'warn'); return; }
    cb.freezeNextRound = true;
    logMsg(`❄️ ${c.name} usa ${it.name}: le entità non metteranno a segno colpi nel prossimo giro.`,'good');
    c.inventory.splice(idx,1);
    return;
  }
  if(it.smiteUndeadItem){
    const cb = state.currentDraw && state.currentDraw.combat;
    const target = cb && cb.entities.find(e=>e.hp>0 && e.undead);
    if(!target){ logMsg(`⚠️ ${it.name}: nessun non-morto presente da annientare in questo momento.`,'warn'); return; }
    target.hp = 0;
    logMsg(`✨ ${c.name} usa ${it.name}: ${target.name} viene annientato all'istante.`,'good');
    c.inventory.splice(idx,1);
    return;
  }
  if(it.wildcardResistanceItem){
    c.wildcardResistance = true;

function useSpell(c, idx){
  const id=c.spells[idx]; const sp=SPELLS_BY_ID[id];
  if(!sp) return;
  if(sp.stealthLikeSpell){
    if(grantHidden(c, sp.name, {bypassDemonRestriction: sp.bypassDemonRestriction})) c.spells.splice(idx,1);
    return;
  }
  if(sp.teleportReunionSpell){
    return openTeleportModal(c, idx);
  }
  if(sp.charmSpell){
    if(dismissEncounterForGroup(sp.name)) c.spells.splice(idx,1);
    return;
  }
  if(sp.sferaSpell){
    if(state.currentDraw && (state.currentDraw.phase==='vuoto-choice'||state.currentDraw.phase==='specchi-choice')){ logMsg(`⚠️ ${sp.name}: aspetta di aver risolto la scelta in corso.`,'warn'); return; }
    const g = groupOf(c);
    state.pendingSferaAntiplanare = { groupId: g?g.id:null };
    logMsg(`🔮 ${c.name} lancia ${sp.name}: l'effetto intrinseco del prossimo piano in cui il gruppo entra sarà completamente annullato.`,'good');
    c.spells.splice(idx,1);
    return;
  }
  if(sp.cerchioSpell){
    if(!state.currentDraw || state.currentDraw.phase==='vuoto-choice'){ logMsg(`⚠️ ${sp.name}: si usa mentre si è in un piano.`,'warn'); return; }
    state.currentDraw.cerchioActive = true;
    logMsg(`🛡️ ${c.name} lancia ${sp.name}: il gruppo para il primo danno subito in questo piano.`,'good');
    c.spells.splice(idx,1);
    return;
  }
  if(sp.sigilloSpell){
    return openSigilloTargetModal(c, idx);
  }
  if(sp.egidaSpell){
    return openEgidaTargetModal(c, idx);
  }
  if(sp.tempraSpell){
    return openTempraTargetModal(c, idx);
  }
  if(sp.sagomaSpell){
    c.sagomaReady = true;
    logMsg(`👤 ${c.name} lancia ${sp.name}: assorbirà la prossima perdita subita, da qualsiasi fonte, poi svanisce.`,'good');
    c.spells.splice(idx,1);
    return;
  }
  if(sp.summonCompanion){
    grantCompanion(c, sp.name, sp.summonCompanion);
    c.spells.splice(idx,1);
    return;
  }
  if(sp.drenaggioSpell){
    if(!state.currentDraw){ logMsg(`⚠️ ${sp.name}: si usa mentre si è in un piano.`,'warn'); return; }
    state.currentDraw.drenaggioActive = true;
    logMsg(`🔮 ${c.name} lancia ${sp.name}: ogni entità sconfitta in questo piano fruttera' anche 1 risorsa planare extra, fino al prossimo salto.`,'good');
    c.spells.splice(idx,1);
    return;
  }
  if(sp.benedizioneSpell){
    return openBenedizioneTargetModal(c, idx);
  }
  if(sp.trasmutazioneSpell){
    return openTrasmutazioneModal(c, idx);
  }
  if(sp.rinascitaSpell){
    logMsg(`✨ ${sp.name} è un incantesimo passivo: resta pronto nella mano e scatta da solo se un compagno sviene a 0 PV.`);
    return;
  }
  if(sp.vaticinioSpell){
    return openVaticinioModal(c, idx);
  }
  const cost = sp.cost||0;
  if(cost>0){
    if(c.resources<cost){ logMsg(`⚠️ ${c.name} non ha abbastanza risorse planari per lanciare ${sp.name} (serve ${cost}).`,'warn'); return; }
    c.resources -= cost;
    logMsg(`💠 ${c.name} spende ${cost} risorsa/e planare/i per lanciare ${sp.name}.`);
  }
  const boosted = !!c.nextSpellBoost;
  if(boosted){ c.nextSpellBoost=false; logMsg(`✨ ${c.name} lancia ${sp.name} con il potenziamento pronto: effetto raddoppiato (+100%).`); }
  if(sp.reward){
    const r=sp.reward;
    if(r.type==='peek'||r.type==='peekBottom'){
      showPeekModal(r);
      c.spells.splice(idx,1);
      return true;
    }
    else if(r.type==='reshuffle'){ reshuffleMazzoPiani(); }
    else if(r.type==='healOther'){
      const amp = state.amplifySpellsActive ? 1 : 0;
      if(amp) logMsg(`🔥 Amplificazione: ${sp.name} ottiene +1 all'effetto.`,'good');
      return openHealOtherModal(c, idx, sp, {...r, n:(r.n||1)+amp}, boosted?2:1);
    }
    else if(r.type==='grantReroll'){ return openGrantRerollModal(c, idx, sp, r); }
  } else if(sp.selfRecupero){
    recuperoFor(c);
    logMsg(`🛌 ${sp.name}: il piano corrente diventa Recupero solo per ${c.name}.`);
  } else if(sp.combatDamageAll){
    // se il bersaglio richiesto non è presente (nessuno scontro, o nessun non-morto/demone
    // presente), lo spell non deve consumarsi per niente: si esce prima dello splice finale.
    const cb = state.currentDraw && state.currentDraw.combat;
    const liveEntities = cb && cb.entities ? cb.entities.filter(e=>e.hp>0) : [];
    const validTargets = sp.filterUndeadDemon ? liveEntities.filter(e=>e.undead||e.demon) : liveEntities;
    if(validTargets.length===0){ logMsg(`⚠️ ${sp.name}: nessuna entità bersaglio presente in questo momento.`,'warn'); return; }
    const amp = state.amplifySpellsActive ? 1 : 0;
    const dmg = sp.combatDamageAll * (boosted?2:1) + amp;
    validTargets.forEach(e=>{ e.hp -= dmg; });
    logMsg(`🔥 ${c.name} lancia ${sp.name}: ${dmg} danni diretti alle entità bersaglio${amp?' (+1 da Amplificazione)':''}.`);
  } else {
    logMsg(`📖 ${c.name} lancia ${sp.name}: ${sp.text} (applica manualmente se serve).`);
  }
  c.spells.splice(idx,1);
}

function openTeleportModal(caster, idx){
  ensureGroups();
  const myGroup = groupOf(caster);
  const options = state.groups.filter(g=>g!==myGroup).flatMap(g=>groupMembers(g).map(m=>({m,g})));
  if(options.length===0){
    logMsg('⚠️ Teletrasporto Planare: nessun altro gruppo separato da raggiungere in questo momento.','warn');
    return false;
  }
  openModal(`<h3>🌀 Teletrasporto Planare</h3><p>${escapeHtml(caster.name)}${myGroup.memberIds.length>1?' (e tutto il suo gruppo, ancora uniti)':''} raggiunge chi?</p>
    <div class="row">${options.map((o,i)=>`<button class="small" data-teleport="${i}">${escapeHtml(o.m.name)}</button>`).join('')}</div>`);
  document.querySelectorAll('[data-teleport]').forEach(b=>b.onclick=()=>{
    const o = options[+b.dataset.teleport];
    const targetGroupId = o.g.id;
    const wasMidTurn = state.currentDraw && state.currentDraw.phase==='plane' && state.currentGroupId===targetGroupId;
    const plane = wasMidTurn ? currentPlane() : null;
    const arriverIds = myGroup.memberIds.slice();
    mergeGroups(targetGroupId, myGroup.id);
    caster.spells.splice(idx,1);
    logMsg(`🌀 ${caster.name}${arriverIds.length>1?' e il suo gruppo':''} si teletrasporta${arriverIds.length>1?'no':''} da ${o.m.name}.`,'good');
    if(plane){
      const arrivers = arriverIds.map(id=>state.players.find(p=>p.id===id)).filter(isConscious);
      const ctx = {family:plane.family, type:plane.type||FAMILIES[plane.family]?.type, planeId:plane.id};
      arrivers.forEach(x=>resetResistanceForPlane(x, plane.family));
      const fn = PLANE_EFFECTS[plane.effectKey];
      if(fn) fn(plane, arrivers, ctx);
      if(RECUPERO_PLANES.has(plane.id)) arrivers.forEach(x=>recuperoFor(x));
      logMsg(`(Gli effetti intrinseci di ${plane.name} si attivano subito per chi arriva, come per chiunque vi entri normalmente.)`);
    }
    closeModal(); render();
  });
  return true;
}
const OGGETTO_CAT_ICON = {arma:'⚔️',armatura:'🛡️',anello:'💍',pozione:'🧪',protezione:'🧿',oneshot:'✨',particolare:'🔮'};
// Stessa tassonomia "di stampa" di cardgen/template.js (badgeCategoryFor): 5 gruppi
// visivi, distinti dalla categoria meccanica `cat` del gioco — usata solo per l'etichetta
// di fallback quando l'immagine composta non carica (di norma il testo è già nei pixel).
const OGGETTO_BADGE_PARTICOLARE_CONSUMABILE = new Set(['o_acquasanta','o_ancoracasa','o_chiaveplanare','o_cimeliodelviandante','o_frammentocristallo']);
function oggettoBadgeCategory(it){
  if(it.cat==='armatura' && it.slot==='shield') return 'scudo';
  if(it.cat==='anello' || it.cat==='protezione') return 'altro';
  if(it.cat==='pozione' || it.cat==='oneshot') return 'consumabile';
  if(it.cat==='particolare') return OGGETTO_BADGE_PARTICOLARE_CONSUMABILE.has(it.id) ? 'consumabile' : 'altro';
  return it.cat;
}
const OGGETTO_BADGE_LABEL = {arma:'Arma',armatura:'Armatura',scudo:'Scudo',altro:'Altro',consumabile:'Consumabile',particolare:'Particolare'};
const SPELL_SCHOOL_ICON = {essenza:'🪄',flusso:'✨',divinazione:'🔮'};

  return true;
}
/* ---------- modal ---------- */
function openModal(html){
  document.getElementById('modalInner').innerHTML = html;
  const d=document.getElementById('modalRoot');
  if(!d.open) d.showModal();
}
function closeModal(){ document.getElementById('modalRoot').close(); }

/* ---------- bind game-level events ---------- */
function bindGame(){
  const ap=document.getElementById('btnAfterPlane'); if(ap) ap.onclick=finishIncontro;
  document.querySelectorAll('[data-open-char]').forEach(b=>b.onclick=()=>openCharManageModal(b.dataset.openChar));
  document.querySelectorAll('[data-quickinfo-item]').forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); showOggettoInfoModal(b.dataset.quickinfoItem); });
  document.querySelectorAll('[data-viewclass]').forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); openClassCardModal(b.dataset.viewclass); });
  document.querySelectorAll('[data-groupjump]').forEach(b=>b.onclick=()=>{
    const gid = b.dataset.groupjump;
    if(state.groups.length>1 && state.jumpedThisRound[gid]) return; // ha già saltato in questo turno sincronizzato
    state.currentGroupId=gid; startJump();
  });
  document.querySelectorAll('[data-groupsplit]').forEach(b=>b.onclick=()=>openSplitGroupModal(b.dataset.groupsplit));
  document.querySelectorAll('[data-vuoto]').forEach(b=>b.onclick=()=>{
    const [cid,what] = b.dataset.vuoto.split(':');
    const c = state.players.find(p=>p.id===cid);
    applyVuotoLoss(c, what);
    state.currentDraw.vuotoChoices = state.currentDraw.vuotoChoices||{};
    state.currentDraw.vuotoChoices[cid]=true;
    render();
  });
  const vuotoContinue = document.getElementById('btnVuotoContinue');
  if(vuotoContinue) vuotoContinue.onclick=()=>{
    const plane = currentPlane();
    state.currentDraw.phase = 'plane';
    drawIncontroForPlane(plane, null);
  };
  document.querySelectorAll('[data-specchio]').forEach(b=>b.onclick=()=>{
    const [cid,stat] = b.dataset.specchio.split(':');
    const c = state.players.find(p=>p.id===cid);
    const r = checkRoll(c, stat);
    state.currentDraw.specchiChoices = state.currentDraw.specchiChoices||{};
    state.currentDraw.specchiChoices[cid] = {stat, roll:r.roll, val:r.val, success:r.success};
    logMsg(`🪞 ${c.name} sfida il proprio riflesso su ${STAT_LABEL[stat]} (tiro ${r.roll} vs ${r.val}): ${r.success?'vince, nessun effetto':'perde'}.`, r.success?'good':'warn');
    if(!r.success) applyTempDebuff(c, stat);
    render();
  });
  const specchiContinue = document.getElementById('btnSpecchiContinue');
  if(specchiContinue) specchiContinue.onclick=()=>{
    const plane = currentPlane();
    state.currentDraw.phase = 'plane';
    drawIncontroForPlane(plane, null);
  };
  setTimeout(renderIncontroAction,0);
}
function openSplitGroupModal(gid){
  const g = state.groups.find(x=>x.id===gid); if(!g) return;
  const members = groupMembers(g);
  openModal(`<h3>✂️ Dividi il gruppo</h3><p>Seleziona chi si stacca per formare un nuovo gruppo a sé (chi va da solo non divide il bottino):</p>
    <div>${members.map(c=>`<label style="display:block;margin-bottom:.4rem;"><input type="checkbox" data-splitmember="${c.id}"> ${escapeHtml(c.name)}</label>`).join('')}</div>
    <div class="row mt1"><button class="primary" id="btnConfirmSplit">Dividi</button><button id="btnCancelSplit">Annulla</button></div>`);
  document.getElementById('btnConfirmSplit').onclick=()=>{
    const chosen = Array.from(document.querySelectorAll('[data-splitmember]:checked')).map(el=>el.dataset.splitmember);
    if(chosen.length===0 || chosen.length===members.length){ closeModal(); return; }
    const newG = splitIntoNewGroup(chosen);
    const names = groupMembers(newG).map(c=>c.name).join(', ');
    logMsg(`✂️ ${names} si stacca dal gruppo, formando un nuovo gruppo a sé.`,'warn');
    closeModal(); render();
  };
  document.getElementById('btnCancelSplit').onclick=closeModal;
}

/* ---------------- BOOT ---------------- */
render();
</script>
